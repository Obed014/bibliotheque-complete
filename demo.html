<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliothèque · Obed SANON</title>
<link href="https://fonts.bunny.net/css?family=fraunces:400,600,900|plus-jakarta-sans:300,400,500,600,700&display=swap" rel="stylesheet">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<style>
/* ══ THEMES ══════════════════════════════════════════ */
:root,
[data-theme="light"] {
  --bg:      #f7f8fa;
  --bg2:     #ffffff;
  --bg3:     #f1f3f6;
  --surf:    rgba(0,0,0,.03);
  --surf2:   rgba(0,0,0,.055);
  --border:  rgba(0,0,0,.09);
  --border2: rgba(0,0,0,.14);
  --accent:  #2563eb;
  --accent2: #1d4ed8;
  --accent-t:rgba(37,99,235,.1);
  --accent-t2:rgba(37,99,235,.18);
  --red:     #dc2626;
  --green:   #16a34a;
  --orange:  #ea580c;
  --purple:  #7c3aed;
  --blue:    #2563eb;
  --text:    #111827;
  --text2:   #4b5563;
  --text3:   #9ca3af;
  --shadow:  0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --r:       12px;
  --rs:      8px;
  --sb-bg:   #111827;
  --sb-text: rgba(255,255,255,.75);
  --sb-text2:rgba(255,255,255,.45);
  --sb-border:rgba(255,255,255,.08);
  --sb-active-bg:rgba(255,255,255,.1);
  --sb-active:rgba(255,255,255,.95);
  --sb-accent:#60a5fa;
}

[data-theme="blue"] {
  --bg:      #0f1d35;
  --bg2:     #162440;
  --bg3:     #1e2f50;
  --surf:    rgba(255,255,255,.04);
  --surf2:   rgba(255,255,255,.07);
  --border:  rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.14);
  --accent:  #60a5fa;
  --accent2: #93c5fd;
  --accent-t:rgba(96,165,250,.12);
  --accent-t2:rgba(96,165,250,.2);
  --red:     #f87171;
  --green:   #4ade80;
  --orange:  #fb923c;
  --purple:  #a78bfa;
  --blue:    #60a5fa;
  --text:    #f0f4ff;
  --text2:   #94a3b8;
  --text3:   #475569;
  --shadow:  0 4px 20px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --r:       12px;
  --rs:      8px;
  --sb-bg:   #0a1628;
  --sb-text: rgba(255,255,255,.75);
  --sb-text2:rgba(255,255,255,.4);
  --sb-border:rgba(255,255,255,.06);
  --sb-active-bg:rgba(96,165,250,.12);
  --sb-active:#93c5fd;
  --sb-accent:#60a5fa;
}

[data-theme="green"] {
  --bg:      #f0faf4;
  --bg2:     #ffffff;
  --bg3:     #e8f5ee;
  --surf:    rgba(0,0,0,.03);
  --surf2:   rgba(0,0,0,.05);
  --border:  rgba(0,0,0,.09);
  --border2: rgba(0,0,0,.14);
  --accent:  #16a34a;
  --accent2: #15803d;
  --accent-t:rgba(22,163,74,.1);
  --accent-t2:rgba(22,163,74,.18);
  --red:     #dc2626;
  --green:   #16a34a;
  --orange:  #ea580c;
  --purple:  #7c3aed;
  --blue:    #2563eb;
  --text:    #14532d;
  --text2:   #4b5563;
  --text3:   #9ca3af;
  --shadow:  0 1px 4px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1);
  --r:       12px;
  --rs:      8px;
  --sb-bg:   #14532d;
  --sb-text: rgba(255,255,255,.8);
  --sb-text2:rgba(255,255,255,.45);
  --sb-border:rgba(255,255,255,.08);
  --sb-active-bg:rgba(255,255,255,.12);
  --sb-active:rgba(255,255,255,.95);
  --sb-accent:#4ade80;
}

[data-theme="dark"] {
  --bg:      #0d0f14;
  --bg2:     #13161e;
  --bg3:     #1a1f2c;
  --surf:    rgba(255,255,255,.04);
  --surf2:   rgba(255,255,255,.07);
  --border:  rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.14);
  --accent:  #c9a84c;
  --accent2: #e8c97a;
  --accent-t:rgba(201,168,76,.12);
  --accent-t2:rgba(201,168,76,.2);
  --red:     #f87171;
  --green:   #4ade80;
  --orange:  #fb923c;
  --purple:  #a78bfa;
  --blue:    #60a5fa;
  --text:    #f0f4ff;
  --text2:   #94a3b8;
  --text3:   #475569;
  --shadow:  0 4px 20px rgba(0,0,0,.5);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  --r:       12px;
  --rs:      8px;
  --sb-bg:   #0a0c11;
  --sb-text: rgba(255,255,255,.72);
  --sb-text2:rgba(255,255,255,.38);
  --sb-border:rgba(255,255,255,.06);
  --sb-active-bg:rgba(201,168,76,.1);
  --sb-active:#e8c97a;
  --sb-accent:#c9a84c;
}

/* ══ RESET ═══════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;transition:background .25s,color .25s;
}

/* ══ ANIMATIONS ══════════════════════════════════════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.au{animation:fadeUp .3s ease both}
.au2{animation:fadeUp .3s .06s ease both}
.au3{animation:fadeUp .3s .12s ease both}
.au4{animation:fadeUp .3s .18s ease both}

/* ══ LOGIN ═══════════════════════════════════════════ */
.login-wrap{
  min-height:100vh;display:flex;align-items:stretch;
  background:var(--bg);
}
.login-left{
  flex:1;background:linear-gradient(160deg,#0a1628 0%,#111827 45%,#0d1f3c 75%,#1a3a5c 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 48px;position:relative;overflow:hidden;
}
.login-left::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.login-left-logo{
  width:80px;height:80px;border-radius:22px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;backdrop-filter:blur(10px);
  box-shadow:0 8px 32px rgba(0,0,0,.2);
}
.login-left-title{
  font-family:'Fraunces',serif;font-size:2.4em;font-weight:900;
  color:#fff;text-align:center;line-height:1.1;margin-bottom:12px;
}
.login-left-title span{color:#a5b4fc;}
.login-left-sub{font-size:.9em;color:rgba(255,255,255,.65);text-align:center;line-height:1.6;max-width:280px;margin-bottom:40px}
.login-features{display:flex;flex-direction:column;gap:14px;width:100%;max-width:300px}
.login-feature{display:flex;align-items:center;gap:14px;padding:13px 18px;background:rgba(255,255,255,.04);border-radius:14px;border:1px solid rgba(255,255,255,.08);transition:all .2s}
.login-feature:hover{background:rgba(255,255,255,.07);border-color:rgba(201,132,58,.25)}
.login-feature-icon{width:36px;height:36px;border-radius:10px;background:rgba(201,132,58,.15);border:1px solid rgba(201,132,58,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.login-feature-text{font-size:.83em;color:rgba(255,255,255,.8);font-weight:500;line-height:1.3}
.login-right{
  width:460px;background:var(--bg2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 48px;
}
.login-box{
  width:100%;max-width:380px;
  animation:fadeUp .4s ease;
}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:36px}
.login-brand-icon{width:40px;height:40px;border-radius:10px;background:var(--accent-t2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.login-brand-name{font-family:'Fraunces',serif;font-size:1.4em;font-weight:700;color:var(--text)}
.login-icon{display:none}
.login-title{font-size:1.6em;font-weight:800;color:var(--text);margin-bottom:5px;font-family:'Fraunces',serif}
.login-sub{font-size:.83em;color:var(--text3);margin-bottom:28px}
@media(max-width:768px){
  .login-wrap{flex-direction:column}
  .login-left{display:none}
  .login-right{width:100%;padding:40px 24px}
}
.login-tabs{display:flex;gap:3px;background:var(--surf2);border-radius:var(--rs);padding:4px;margin-bottom:24px}
.login-tab{flex:1;padding:8px 4px;border-radius:calc(var(--rs) - 2px);border:none;background:transparent;color:var(--text2);font-size:.78em;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.login-tab.active{background:var(--bg2);color:var(--accent);box-shadow:var(--shadow)}
.login-err{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);color:var(--red);padding:10px 14px;border-radius:var(--rs);font-size:.83em;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.login-info{background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.25);color:#15803d;padding:10px 14px;border-radius:var(--rs);font-size:.83em;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.login-notice{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:8px 12px;border-radius:var(--rs);font-size:.8em;margin-bottom:12px;display:flex;align-items:flex-start;gap:7px;line-height:1.5}

/* ══ SHELL ════════════════════════════════════════════ */
.shell{display:flex;min-height:100vh}

/* ══ SIDEBAR ══════════════════════════════════════════ */
.sidebar{
  width:260px;background:var(--sb-bg);
  display:flex;flex-direction:column;
  position:fixed;height:100vh;z-index:100;
  transition:background .25s;
  box-shadow:4px 0 24px rgba(0,0,0,.18);
}
.sb-head{
  padding:24px 18px 18px;
  border-bottom:1px solid var(--sb-border);
  background:linear-gradient(180deg,rgba(99,102,241,.08) 0%,transparent 100%);
}
.sb-logo-row{display:flex;align-items:center;gap:12px}
.sb-logo{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,rgba(99,102,241,.3),rgba(139,92,246,.2));
  border:1px solid rgba(99,102,241,.35);
  display:flex;align-items:center;justify-content:center;
  color:var(--sb-accent);flex-shrink:0;object-fit:cover;
  box-shadow:0 4px 12px rgba(99,102,241,.2);
}
.sb-libname{font-family:'Fraunces',serif;font-size:1.05em;font-weight:700;color:#fff;line-height:1.2}
.sb-status{display:inline-flex;align-items:center;gap:5px;font-size:.67em;color:var(--sb-text2);margin-top:2px}
.sb-status-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;flex-shrink:0;animation:pulse 2s infinite}
.sb-status-dot.off{background:#fb923c;animation:none}

.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-nav::-webkit-scrollbar{width:2px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.sb-sec{font-size:.6em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-text2);padding:16px 12px 6px}

.nbtn{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:10px 14px;background:none;border:none;
  color:var(--sb-text);font-size:.85em;font-weight:500;
  cursor:pointer;transition:all .18s;text-align:left;
  font-family:inherit;border-radius:12px;margin-bottom:3px;
  position:relative;
}
.nbtn:hover{background:var(--sb-active-bg);color:var(--sb-active)}
.nbtn.active{
  background:linear-gradient(135deg,rgba(96,165,250,.2),rgba(139,92,246,.12));
  color:#fff;font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(96,165,250,.25);
}
.nbtn.active .ni{
  background:rgba(96,165,250,.25);
  color:var(--sb-accent);
  border-radius:9px;
}
.nbtn .ni{
  width:34px;height:34px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:9px;
  background:rgba(255,255,255,.05);
  transition:all .18s;
}
.nbtn:hover .ni{background:rgba(255,255,255,.1)}
.nbtn .nl{flex:1}
.nbadge{
  background:rgba(255,255,255,.07);border-radius:20px;
  padding:2px 7px;font-size:.69em;font-weight:700;
  color:var(--sb-text2);
}
.nbtn.active .nbadge{background:var(--accent-t);color:var(--sb-accent)}

.sb-foot{padding:12px 12px 18px;border-top:1px solid var(--sb-border);display:flex;flex-direction:column;gap:6px}
.sb-foot-row{display:flex;gap:5px}
.sfbtn{
  flex:1;padding:7px 5px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  color:var(--sb-text);border-radius:var(--rs);
  font-size:.74em;cursor:pointer;font-family:inherit;
  transition:all .16s;text-align:center;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.sfbtn:hover{background:rgba(255,255,255,.1);color:var(--sb-active)}
.sfbtn.zotero{
  background:var(--accent-t);border-color:rgba(255,255,255,.08);
  color:var(--sb-accent);
}
.sfbtn.zotero:hover{background:var(--accent-t2)}
.sfbtn.logout{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.15);color:#f87171}
.sfbtn.logout:hover{background:rgba(220,38,38,.15)}
.sb-user{font-size:.68em;color:var(--sb-text2);text-align:center;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ══ MAIN ═════════════════════════════════════════════ */
.main{flex:1;margin-left:252px;padding:30px 30px 60px;max-width:calc(100vw - 252px)}

/* ══ PAGE HEADER ══════════════════════════════════════ */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.pt{font-family:'Fraunces',serif;font-size:1.8em;font-weight:500;color:var(--text)}

/* ══ STATS ════════════════════════════════════════════ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:26px}
.sc{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:16px;padding:20px 22px;
  position:relative;overflow:hidden;
  transition:all .22s;
  display:flex;flex-direction:column;gap:4px;
}
.sc:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);border-color:var(--border2);transform:translateY(-2px)}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:16px 16px 0 0}
.sc::after{content:'';position:absolute;top:12px;right:16px;width:44px;height:44px;border-radius:12px;opacity:.12}
.sc.c-blue::before{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.sc.c-blue::after{background:#2563eb}
.sc.c-green::before{background:linear-gradient(90deg,#16a34a,#4ade80)}
.sc.c-green::after{background:#16a34a}
.sc.c-purple::before{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.sc.c-purple::after{background:#7c3aed}
.sc.c-orange::before{background:linear-gradient(90deg,#ea580c,#fb923c)}
.sc.c-orange::after{background:#ea580c}
.sc.c-red::before{background:linear-gradient(90deg,#dc2626,#f87171)}
.sc.c-red::after{background:#dc2626}
.sc.c-accent::before{background:linear-gradient(90deg,#2563eb,#818cf8)}
.sc.c-accent::after{background:#2563eb}
.sc-icon{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;opacity:.9}
.sn{font-size:2.3em;font-weight:700;color:var(--text);line-height:1;margin-bottom:2px;font-family:'Fraunces',serif}
.sl{font-size:.76em;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.sd{font-size:.72em;color:var(--text3);font-weight:400;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}

/* ══ BUTTONS ══════════════════════════════════════════ */
.btn{
  padding:9px 18px;border:none;border-radius:var(--rs);
  font-size:.86em;font-weight:600;cursor:pointer;
  transition:all .16s;display:inline-flex;align-items:center;gap:6px;
  font-family:inherit;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn-primary:hover{background:var(--accent2);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn-success{background:var(--accent-t);color:var(--green);border:1px solid rgba(22,163,74,.2)}
.btn-success:hover{background:rgba(22,163,74,.18)}
.btn-danger{background:rgba(220,38,38,.08);color:var(--red);border:1px solid rgba(220,38,38,.18)}
.btn-danger:hover{background:rgba(220,38,38,.15)}
.btn-secondary{background:var(--surf2);color:var(--text2);border:1px solid var(--border2)}
.btn-secondary:hover{background:var(--bg3);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surf);color:var(--text2)}
.btn-email{background:rgba(37,99,235,.08);color:var(--blue);border:1px solid rgba(37,99,235,.18)}
.btn-email:hover{background:rgba(37,99,235,.15)}
.btn-sm{padding:6px 12px;font-size:.79em}

/* ══ SEARCH / FILTER ══════════════════════════════════ */
.sw{position:relative;margin-bottom:14px}
.sw-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.sbar{
  width:100%;padding:9px 13px 9px 36px;
  border:1px solid var(--border);border-radius:var(--rs);
  font-size:.88em;background:var(--bg2);color:var(--text);
  font-family:inherit;transition:border-color .18s,box-shadow .18s;
}
.sbar:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-t)}
.fbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.fsel{
  padding:8px 12px;border:1px solid var(--border);border-radius:var(--rs);
  font-size:.84em;background:var(--bg2);color:var(--text2);
  cursor:pointer;font-family:inherit;transition:border-color .18s;
}
.fsel:focus{outline:none;border-color:var(--accent)}

/* ══ CARDS ════════════════════════════════════════════ */
.grid{display:grid;gap:12px}
.card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:18px;
  transition:all .18s;
}
.card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.card.late{border-color:rgba(220,38,38,.25);background:rgba(220,38,38,.02)}
.ct{font-size:1.02em;font-weight:700;color:var(--text);margin-bottom:3px}
.cs{color:var(--text3);font-size:.83em;margin-bottom:2px;line-height:1.5}
.cm{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.ca{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}

/* ══ BADGES ═══════════════════════════════════════════ */
.b{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:.72em;font-weight:600}
.bg{background:rgba(22,163,74,.1);color:var(--green)}
.br{background:rgba(220,38,38,.1);color:var(--red)}
.bp{background:rgba(124,58,237,.1);color:var(--purple)}
.bb{background:rgba(37,99,235,.1);color:var(--blue)}
.bo{background:rgba(234,88,12,.1);color:var(--orange)}
.bk{background:var(--surf2);color:var(--text3)}
.ba{background:var(--accent-t);color:var(--accent)}

/* ══ MODAL ════════════════════════════════════════════ */
.ov{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;animation:fadeIn .15s;
}
.mc{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:18px;padding:30px;
  max-width:580px;width:93%;max-height:90vh;overflow-y:auto;
  animation:fadeUp .2s ease;box-shadow:var(--shadow-lg);
}
.mc.wide{max-width:720px}
.mc::-webkit-scrollbar{width:3px}
.mc::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.mt{font-family:'Fraunces',serif;font-size:1.4em;font-weight:500;color:var(--text)}
.xb{
  background:var(--surf2);border:none;cursor:pointer;
  color:var(--text3);width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:all .16s;
}
.xb:hover{background:var(--bg3);color:var(--text)}

/* ══ FORMS ════════════════════════════════════════════ */
.fg{margin-bottom:14px}
.fl{display:block;font-weight:600;color:var(--text3);margin-bottom:4px;font-size:.78em;letter-spacing:.03em;text-transform:uppercase}
.fi,.ft{
  width:100%;padding:9px 12px;
  border:1px solid var(--border);border-radius:var(--rs);
  font-size:.88em;background:var(--bg3);color:var(--text);
  font-family:inherit;transition:border-color .18s,box-shadow .18s;
}
.fi:focus,.ft:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-t)}
.ft{resize:vertical;min-height:78px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fac{display:flex;gap:9px;margin-top:22px}

/* ══ PHOTO UPLOAD ═════════════════════════════════════ */
.pu{
  border:2px dashed var(--border2);border-radius:var(--r);
  padding:20px;text-align:center;cursor:pointer;
  transition:all .2s;background:var(--surf);
}
.pu:hover{border-color:var(--accent);background:var(--accent-t)}
.pp{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin:10px auto;display:block}

/* ══ SCANNER ══════════════════════════════════════════ */
.scan-box{
  background:var(--bg2);border:1px solid var(--border2);
  padding:22px;border-radius:var(--r);margin-bottom:22px;
  box-shadow:var(--shadow);
}
.scan-in{
  width:100%;padding:12px 16px;
  border:1.5px solid var(--border2);border-radius:var(--rs);
  font-size:1em;font-weight:500;font-family:inherit;
  background:var(--bg3);color:var(--text);
  transition:border-color .2s,box-shadow .2s;
}
.scan-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-t)}
.scan-st{margin-top:11px;padding:9px 14px;background:var(--surf2);border-radius:var(--rs);font-size:.87em;border:1px solid var(--border)}

/* ══ CAT GRID ═════════════════════════════════════════ */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px;margin-bottom:26px}
.cc{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;
  transition:all .18s;
}
.cc:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.cn{font-size:2em;font-weight:700;color:var(--accent);font-family:'Fraunces',serif}
.cl{font-size:.73em;color:var(--text3);margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}

/* ══ ALERTS ═══════════════════════════════════════════ */
.al{padding:11px 15px;border-radius:var(--rs);margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:.85em;flex-wrap:wrap}
.al-w{background:rgba(234,88,12,.08);color:var(--orange);border:1px solid rgba(234,88,12,.18)}
.al-s{background:rgba(22,163,74,.08);color:var(--green);border:1px solid rgba(22,163,74,.18)}
.al-i{background:var(--accent-t);color:var(--accent);border:1px solid var(--accent-t2)}
.al-e{background:rgba(220,38,38,.08);color:var(--red);border:1px solid rgba(220,38,38,.18)}

/* ══ EMPTY ════════════════════════════════════════════ */
.empty{text-align:center;padding:56px 20px;color:var(--text3)}
.empty-i{margin-bottom:12px;opacity:.3;display:flex;justify-content:center}

/* ══ SETTINGS SECTION ════════════════════════════════ */
.ss{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px}
.ss h3{font-size:.78em;font-weight:700;color:var(--text2);margin-bottom:13px;text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ══ QR / AVATAR ══════════════════════════════════════ */
.qr{width:82px;height:82px;border-radius:var(--rs);flex-shrink:0;background:white;padding:3px;border:1px solid var(--border)}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--accent-t2);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent-t),var(--surf2));color:var(--accent);box-shadow:0 2px 8px rgba(37,99,235,.15)}

/* ══ TOAST ════════════════════════════════════════════ */
.tc{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:7px;z-index:9999;pointer-events:none}
.toast{
  background:var(--bg2);color:var(--text);border:1px solid var(--border2);
  padding:11px 16px;border-radius:var(--rs);
  box-shadow:var(--shadow-lg);font-size:.85em;font-weight:500;
  animation:toastIn .2s ease;min-width:200px;
  display:flex;align-items:center;gap:8px;
}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
.toast.warn{border-left:3px solid var(--orange)}

/* ══ ZOTERO ═══════════════════════════════════════════ */
.zdrop{
  border:2px dashed var(--border2);border-radius:var(--r);
  padding:26px;text-align:center;cursor:pointer;
  background:var(--surf);transition:all .2s;margin-bottom:14px;
}
.zdrop:hover{border-color:var(--accent);background:var(--accent-t)}
.zlist{max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:14px}
.zlist::-webkit-scrollbar{width:3px}
.zlist::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.zrow{display:flex;align-items:start;gap:11px;padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .13s}
.zrow:last-child{border-bottom:none}
.zrow:hover,.zrow.sel{background:var(--accent-t)}

/* ══ DIVIDER / SPINNER ════════════════════════════════ */
.divider{height:1px;background:var(--border);margin:18px 0}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;flex-shrink:0}

/* ══ THEME SWATCHES ═══════════════════════════════════ */
.theme-swatches{display:flex;gap:9px;flex-wrap:wrap}
.theme-swatch{
  cursor:pointer;border-radius:var(--rs);padding:9px 13px;
  display:flex;align-items:center;gap:7px;
  transition:all .18s;border:2px solid transparent;
  font-size:.82em;font-weight:600;
}

.selected-card{outline:2px solid var(--accent)!important;background:var(--accent-t)!important}
.selected-card:hover{background:var(--accent-t)!important}
kbd{font-family:monospace;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:.85em}
.b.bo{background:rgba(234,88,12,.13);color:#ea580c}
.pending-badge{display:inline-flex;align-items:center;justify-content:center;background:#f97316;color:#fff;border-radius:99px;font-size:.65em;font-weight:800;padding:1px 6px;margin-left:4px}

/* ══ RESPONSIVE ═══════════════════════════════════════ */
@media(max-width:768px){
  .sidebar{width:100%;height:auto;position:relative}
  .main{margin-left:0;padding:16px;max-width:100%}
  .fgrid{grid-template-columns:1fr}
}

/* ══ SIGNATURE / ABOUT ══════════════════════════════════ */
.owner-sig{
  padding:10px 16px;border-top:1px solid var(--sb-border);
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.03);
}
.owner-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--sb-accent),var(--accent2,#1d4ed8));
  display:flex;align-items:center;justify-content:center;
  font-size:.75em;font-weight:800;color:#fff;flex-shrink:0;
  letter-spacing:.02em;
}
.owner-info{flex:1;min-width:0}
.owner-name{font-size:.72em;font-weight:700;color:var(--sb-active);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owner-role{font-size:.62em;color:var(--sb-text2);letter-spacing:.03em}

/* ══ ABOUT MODAL ════════════════════════════════════════ */
.about-hero{
  background:linear-gradient(135deg,#1e3a5f 0%,#0f1d35 100%);
  border-radius:var(--r);padding:28px;text-align:center;margin-bottom:18px;
  position:relative;overflow:hidden;
}
.about-hero::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(96,165,250,.1);
}
.about-hero::after{
  content:'';position:absolute;bottom:-30px;left:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(201,168,76,.08);
}
.about-avatar{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6em;font-weight:800;color:#fff;
  margin:0 auto 14px;border:3px solid rgba(255,255,255,.2);
  position:relative;z-index:1;
}
.about-name{font-family:'Fraunces',serif;font-size:1.4em;color:#fff;font-weight:500;position:relative;z-index:1}
.about-title{font-size:.78em;color:rgba(255,255,255,.55);margin-top:4px;position:relative;z-index:1;letter-spacing:.05em;text-transform:uppercase}

/* ══ DONATIONS ════════════════════════════════════════ */
.donation-card{
  background:linear-gradient(135deg,rgba(22,163,74,.08),rgba(22,163,74,.03));
  border:1px solid rgba(22,163,74,.2);border-radius:var(--r);padding:18px;
  margin-bottom:14px;
}
.donation-card:hover{border-color:rgba(22,163,74,.35);box-shadow:var(--shadow)}

/* ══ PUBLIC CATALOGUE ════════════════════════════════ */
.pub-hero{
  background:linear-gradient(135deg,var(--sb-bg) 0%,#1e3a5f 100%);
  padding:40px 30px;text-align:center;margin-bottom:24px;
  border-radius:0 0 var(--r) var(--r);
}
.pub-search-wrap{
  max-width:520px;margin:0 auto;position:relative;
}
.pub-sbar{
  width:100%;padding:14px 18px 14px 46px;
  border:2px solid rgba(255,255,255,.2);border-radius:30px;
  font-size:1em;background:rgba(255,255,255,.1);color:#fff;
  font-family:inherit;backdrop-filter:blur(8px);
  transition:border-color .2s,box-shadow .2s;
}
.pub-sbar::placeholder{color:rgba(255,255,255,.5)}
.pub-sbar:focus{outline:none;border-color:rgba(255,255,255,.5);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.pub-search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.6)}

/* ══ SUGGESTIONS ═════════════════════════════════════ */
.sug-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;transition:all .18s;
}
.sug-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.vote-btn{
  background:var(--surf2);border:1px solid var(--border2);
  border-radius:var(--rs);padding:6px 12px;cursor:pointer;
  font-size:.78em;font-weight:700;color:var(--text2);
  transition:all .15s;display:flex;align-items:center;gap:5px;
  font-family:inherit;
}
.vote-btn:hover,.vote-btn.voted{background:var(--accent-t);color:var(--accent);border-color:var(--accent-t2)}

/* ══ STATISTICS ══════════════════════════════════════ */
.chart-wrap{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;margin-bottom:14px;
}
.chart-title{font-size:.78em;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.bar-chart-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-chart-label{width:90px;font-size:.78em;color:var(--text2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-chart-bar{height:20px;border-radius:4px;background:var(--accent);transition:width .4s ease;min-width:4px}
.bar-chart-val{font-size:.75em;color:var(--text3);font-weight:600;white-space:nowrap}

/* ══ KIOSK ═══════════════════════════════════════════ */
.kiosk-wrap{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;background:var(--bg);
}
.kiosk-box{
  width:100%;max-width:480px;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:24px;padding:40px 36px;box-shadow:var(--shadow-lg);
  text-align:center;
}
.kiosk-icon{
  width:80px;height:80px;border-radius:20px;
  background:var(--accent-t2);border:2px solid var(--accent-t2);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;color:var(--accent);
}
.kiosk-title{font-family:'Fraunces',serif;font-size:2em;color:var(--text);margin-bottom:8px}
.kiosk-sub{color:var(--text3);font-size:.9em;margin-bottom:28px}
.kiosk-scan{
  width:100%;padding:16px 20px;
  border:2px solid var(--border2);border-radius:var(--rs);
  font-size:1.1em;font-weight:600;font-family:inherit;
  background:var(--bg3);color:var(--text);
  transition:border-color .2s,box-shadow .2s;text-align:center;
}
.kiosk-scan:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-t)}
.kiosk-result{
  margin-top:20px;padding:16px;border-radius:var(--rs);
  font-weight:600;font-size:.95em;
}
.kiosk-result.ok{background:rgba(22,163,74,.1);color:var(--green);border:1px solid rgba(22,163,74,.25)}
.kiosk-result.err{background:rgba(220,38,38,.1);color:var(--red);border:1px solid rgba(220,38,38,.25)}
.kiosk-result.info{background:var(--accent-t);color:var(--accent);border:1px solid var(--accent-t2)}

/* ══ WAITLIST NOTIFICATION ════════════════════════════ */
.waitlist-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(234,88,12,.1);color:var(--orange);
  border:1px solid rgba(234,88,12,.2);border-radius:20px;
  padding:3px 10px;font-size:.72em;font-weight:700;
}

/* ══ BOOK COVERS ════════════════════════════════════════ */
.book-cover{
  width:48px;height:68px;border-radius:6px;object-fit:cover;
  flex-shrink:0;background:var(--bg3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4em;overflow:hidden;
}
.book-cover img{width:100%;height:100%;object-fit:cover;border-radius:5px}

/* ══ ACTIVITY CHART ══════════════════════════════════════ */
.activity-dots{
  display:flex;gap:6px;align-items:flex-end;height:80px;
  position:relative;
}
.activity-dot{
  flex:1;border-radius:5px 5px 0 0;
  background:linear-gradient(180deg,var(--accent),rgba(37,99,235,.45));
  min-width:8px;transition:all .3s;
  box-shadow:0 2px 8px rgba(37,99,235,.2);
}
.activity-dot:hover{opacity:1}

/* ══ MEMBERSHIP BADGE ════════════════════════════════════ */
.mbship-active{background:rgba(22,163,74,.1);color:var(--green);border:1px solid rgba(22,163,74,.2);border-radius:20px;padding:3px 10px;font-size:.72em;font-weight:700}
.mbship-expired{background:rgba(220,38,38,.1);color:var(--red);border:1px solid rgba(220,38,38,.2);border-radius:20px;padding:3px 10px;font-size:.72em;font-weight:700}
.mbship-expiring{background:rgba(234,88,12,.1);color:var(--orange);border:1px solid rgba(234,88,12,.2);border-radius:20px;padding:3px 10px;font-size:.72em;font-weight:700}

/* ══ RECEIPT / PRINT ═════════════════════════════════════ */
.receipt{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r);padding:20px;
  font-family:monospace;font-size:.8em;
  line-height:1.8;
}
.receipt-row{display:flex;justify-content:space-between;gap:10px}
.receipt-sep{border:none;border-top:1px dashed var(--border);margin:8px 0}

/* ══ ONBOARDING ══════════════════════════════════════════ */
.onboard-step{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 24px;
  display:flex;gap:16px;align-items:flex-start;
  transition:all .2s;
}
.onboard-step.done{opacity:.5}
.onboard-step.active{border-color:var(--accent);background:var(--accent-t)}
.onboard-num{
  width:32px;height:32px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.85em;flex-shrink:0;
}
.onboard-step.done .onboard-num{background:var(--green)}

/* ══ MESSAGING ═══════════════════════════════════════════ */
.msg-bubble{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
  transition:all .18s;
}
.msg-bubble:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.msg-bubble.unread{border-left:3px solid var(--accent);background:var(--accent-t)}

/* ══ CALENDAR ════════════════════════════════════════════ */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:2px;margin-top:12px;
}
.cal-cell{
  aspect-ratio:1;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:.8em;cursor:pointer;transition:all .15s;
  position:relative;
}
.cal-cell:hover{background:var(--bg3)}
.cal-cell.today{background:var(--accent);color:#fff;font-weight:700}
.cal-cell.has-event::after{
  content:'';position:absolute;bottom:3px;
  width:4px;height:4px;border-radius:50%;background:var(--gold,#c9843a);
}
.cal-cell.other-month{opacity:.3}

/* ══ PWA INSTALL BANNER ══════════════════════════════════ */
.pwa-banner{
  position:fixed;bottom:20px;right:20px;z-index:1000;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r);padding:14px 18px;
  box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:12px;
  max-width:320px;animation:fadeUp .4s ease;
}

/* ══ DEMO MODE BANNER ════════════════════════════════════ */
.demo-banner{
  background:linear-gradient(90deg,var(--orange),#f59e0b);
  color:#fff;text-align:center;padding:8px 16px;
  font-size:.8em;font-weight:700;letter-spacing:.03em;
  position:sticky;top:0;z-index:200;
}

/* ══ LANGUAGE SELECTOR ═══════════════════════════════════ */
.lang-btn{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--rs);padding:5px 10px;
  font-size:.75em;font-weight:700;cursor:pointer;
  color:var(--text2);transition:all .15s;font-family:inherit;
}
.lang-btn.active{background:var(--accent-t);color:var(--accent);border-color:var(--accent-t2)}

/* ══ TEAM TABS ═════════════════════════════════════════════════════ */
.team-tabs{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px;}

// Générer la cote Dewey complète : ex "843.914 DUM"
function getDeweyShelf(book){
  const cat = book.category || 'Autre';
  const entry = DEWEY_MAP[cat] || DEWEY_MAP['Autre'];
  // Choisir la subdivision selon les mots-clés du titre/auteur si disponibles
  let dewey = entry.base;
  // Chercher correspondance dans les sous-catégories
  const titleLower = (book.title||'').toLowerCase();
  for(const [key, code] of Object.entries(entry.sub)){
    if(key !== 'default' && titleLower.includes(key.toLowerCase())){
      dewey = code; break;
    }
  }
  if(dewey === entry.base) dewey = entry.sub.default || entry.base;
  // Cote auteur : 3 premières lettres du nom de famille en MAJUSCULES
  const authorParts = (book.author||'').trim().split(/\s+/);
  // Prendre le dernier mot (nom de famille) ou le premier si un seul mot
  const lastName = authorParts.length > 1 ? authorParts[authorParts.length-1] : authorParts[0] || '';
  const authorCode = lastName.substring(0,3).toUpperCase().replace(/[^A-Z]/g,'') || 'XXX';
  return `${dewey} ${authorCode}`.trim();
}

// ══ SUPABASE REST ══════════════════════════════════════
async function sbRefreshSession(){
  try{
    const stored = getStoredSession();
    if(!stored?.refresh_token) return null;
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:stored.refresh_token})
    });
    if(!r.ok) return null;
    const data = await r.json();
    if(data.access_token){
      storeSession(data);
      return data.access_token;
    }
  }catch(e){}
  return null;
}

async function sb(table, method='GET', body=null, qs='', token=null){
  const url=`${SB_URL}/rest/v1/${table}${qs}`;
  const tok=token&&token!==''?token:SB_KEY;
  const h={'apikey':SB_KEY,'Authorization':`Bearer ${tok}`,'Content-Type':'application/json','Prefer':'return=representation'};
  const r=await fetch(url,{method,headers:h,body:body?JSON.stringify(body):null});
  if(!r.ok){
    const e=await r.text();
    // JWT expiré → refresh automatique et retry
    if(e.includes('JWT expired')||e.includes('PGRST303')){
      const newToken = await sbRefreshSession();
      if(newToken){
        const tok2=newToken;
        const h2={'apikey':SB_KEY,'Authorization':`Bearer ${tok2}`,'Content-Type':'application/json','Prefer':'return=representation'};
        const r2=await fetch(url,{method,headers:h2,body:body?JSON.stringify(body):null});
        if(r2.ok) return r2.json().catch(()=>[]);
      }
      // Refresh échoué → forcer re-login
      clearSession();
      window.location.reload();
      return;
    }
    throw new Error(e);
  }
  const t=await r.text(); return t?JSON.parse(t):[];
}

// ══ SUPABASE AUTH ══════════════════════════════════════
async function sbSignIn(identifier,password){
  // Accept email OR member code (MBR-XXXX)
  let email=identifier.trim();
  if(/^MBR-/i.test(email)||(/^\d+$/.test(email))){
    // It's a member code — resolve to email via DB
    const code=email.toUpperCase().startsWith('MBR-')?email.toUpperCase():`MBR-${email.padStart(4,'0')}`;
    try{
      const r2=await fetch(`${SB_URL}/rest/v1/members?member_code=eq.${encodeURIComponent(code)}&select=email`,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
      const rows=await r2.json();
      if(rows&&rows.length&&rows[0].email) email=rows[0].email;
      else throw new Error(`Aucun membre trouvé avec le code ${code}`);
    }catch(e){ if(e.message.includes('Aucun')) throw e; }
  }
  const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  if(!r.ok){
    const e=await r.json();
    // Log complet pour débogage — affiche le message exact de Supabase
    const errMsg=e.error_description||e.message||e.msg||e.error||JSON.stringify(e);
    throw new Error(errMsg);
  }
  const data=await r.json();
  // Vérifier que la session est bien présente
  if(!data.access_token){ throw new Error('Pas de session — réponse: '+JSON.stringify(data).slice(0,100)); }
  return data;
}
async function sbSignUp(email,password){
  const r=await fetch(`${SB_URL}/auth/v1/signup`,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  if(!r.ok){ const e=await r.json(); throw new Error(e.error_description||e.msg||'Erreur inscription'); }
  return r.json();
}
async function sbSignOut(token){
  await fetch(`${SB_URL}/auth/v1/logout`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':`Bearer ${token}`}});
}

function getHashParams(){
  const hash=window.location.hash.substring(1);
  const params={};
  hash.split('&').forEach(p=>{ const [k,v]=p.split('='); if(k) params[k]=decodeURIComponent(v||''); });
  return params;
}

const ROLES = { admin: 'Administrateur', librarian: 'Bibliothécaire', readonly: 'Lecture seule' };

// Emails administrateurs — ajoutez les vôtres ici
const ADMIN_EMAILS = [SB_ADMIN_EMAIL].filter(Boolean).map(e=>e.toLowerCase());

function getEmailFromSession(session){
  // Try session.user.email first
  if(session?.user?.email) return session.user.email;
  // Fallback: decode JWT token to get email
  try{
    const token = session?.access_token;
    if(!token) return null;
    const payload = JSON.parse(atob(token.split('.')[1]));
    return payload.email || payload.sub_email || null;
  }catch(e){ return null; }
}

async function getUserRole(userId, userEmail, userToken){
  // 1. Hardcoded admin emails always win
  if(userEmail && ADMIN_EMAILS.includes(userEmail.toLowerCase())) return 'admin';
  // 2. Lire avec le token du membre (pour que auth.uid() soit correct côté RLS)
  //    Si pas de token, fallback sur SB_KEY
  const readTok = userToken || SB_KEY;
  try{
    const url=`${SB_URL}/rest/v1/user_roles?user_id=eq.${userId}&select=role,email`;
    const r=await fetch(url,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${readTok}`}});
    if(r.ok){
      const rows=await r.json();
      if(rows && rows.length) return rows[0].role;
    }
    // Pas de résultat — essayer avec SB_KEY en fallback
    const r2=await fetch(url,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
    if(r2.ok){
      const rows2=await r2.json();
      if(rows2 && rows2.length) return rows2[0].role;
    }
    // Nouvel utilisateur — vérifier lib_preassign puis créer entrée readonly
    let assignedRole = 'readonly';
    try{
      const preAssigned = JSON.parse(localStorage.getItem('lib_preassign')||'{}');
      const emailKey = (userEmail||'').toLowerCase();
      if(emailKey && preAssigned[emailKey]){
        assignedRole = preAssigned[emailKey];
        delete preAssigned[emailKey];
        localStorage.setItem('lib_preassign', JSON.stringify(preAssigned));
      }
    }catch(e){}
    try{
      await fetch(`${SB_URL}/rest/v1/user_roles`,{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({user_id:userId, role:assignedRole, email:userEmail||''})
      });
    }catch(e){}
    return assignedRole;
  }catch(e){ return 'readonly'; }
}

async function setUserRole(userId, role, email, adminToken){
  // Protéger les admins hardcodés — impossible de changer leur rôle
  if(email && ADMIN_EMAILS.includes(email.toLowerCase())) return;
  const tok = SB_KEY; // Toujours SB_KEY pour les opérations admin
  // UPSERT — évite le DELETE qui peut affecter d'autres lignes selon la RLS
  await fetch(`${SB_URL}/rest/v1/user_roles`,{
    method:'POST',
    headers:{
      'apikey':SB_KEY,
      'Authorization':`Bearer ${SB_KEY}`,
      'Content-Type':'application/json',
      'Prefer':'resolution=merge-duplicates,return=minimal'
    },
    body:JSON.stringify({user_id:userId, role, email:email||''})
  });
}

const PAGE_SIZE = 200; // ajuster selon les besoins
async function sbAll(table, qs='', mapper=x=>x){
  // Charge toutes les pages d'une table Supabase avec pagination automatique
  let all=[], offset=0, done=false;
  const sep = qs.includes('?')?'&':'?';
  while(!done){
    const rows = await sb(table,'GET',null,`${qs}${sep}limit=${PAGE_SIZE}&offset=${offset}`);
    if(!Array.isArray(rows)||rows.length===0){ done=true; break; }
    all = all.concat(rows.map(mapper));
    if(rows.length < PAGE_SIZE) done=true;
    else offset += PAGE_SIZE;
  }
  return all;
}

function parseBib(txt){
  const res=[],lines=txt.split('\n');
  const cm={book:'Autre',article:'Science',inproceedings:'Science',phdthesis:'Science',mastersthesis:'Science',techreport:'Technologie',manual:'Technologie'};
  let cur=null;
  for(const raw of lines){
    const line=raw.trim();
    if(/^@\w+\s*\x7B/.test(line)){
      const t=(line.match(/^@(\w+)/)||[])[1]||'misc';
      cur={type:t.toLowerCase(),fields:{}};res.push(cur);
    } else if(cur&&line.includes('=')){
      const eq=line.indexOf('=');const key=line.slice(0,eq).trim().toLowerCase();
      let val=line.slice(eq+1).trim();
      if(val.charAt(0)==='\x7B') val=val.slice(1);
      if(val.slice(-2)==='\x7D,') val=val.slice(0,-2);
      else if(val.slice(-1)===',') val=val.slice(0,-1);
      else if(val.slice(-1)==='\x7D') val=val.slice(0,-1);
      if(key&&val) cur.fields[key]=(cur.fields[key]?cur.fields[key]+' ':'')+val.replace(/\s+/g,' ').trim();
    }
  }
  return res.filter(e=>e.fields.title).map(e=>{
    const f=e.fields;
    return {title:f.title||'',author:(f.author||f.editor||'').replace(/ and /gi,', '),isbn:f.isbn||f.isbn13||'',publisher:f.publisher||'',year:f.year||'',description:f.abstract||'',category:cm[e.type]||'Autre',shelf:'',copies:1};
  });
}
function parseRIS(txt){
  const res=[];
  txt.split(/\nER\s*-/).forEach(block=>{
    const f={};
    block.split('\n').forEach(line=>{const m=line.match(/^([A-Z][A-Z0-9])\s+-\s+(.+)$/);if(m){if(!f[m[1]])f[m[1]]=[];f[m[1]].push(m[2].trim());}});
    const title=(f['TI']||f['T1']||f['BT']||[''])[0];if(!title)return;
    const ty=(f['TY']||['BOOK'])[0];
    const cm={BOOK:'Autre',JOUR:'Science',CONF:'Science',THES:'Science',RPRT:'Technologie',COMP:'Technologie'};
    res.push({title,author:(f['AU']||f['A1']||[]).join(', '),year:((f['PY']||f['Y1']||[''])[0]).substring(0,4),isbn:(f['SN']||[''])[0],publisher:(f['PB']||[''])[0],description:(f['AB']||f['N2']||[''])[0],category:cm[ty]||'Autre',shelf:'',copies:1});
  });
  return res;
}
function parseCSV(txt){
  function pl(line){const res=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){cur+='"';i++;}else if(c==='"'){q=!q;}else if(c===','&&!q){res.push(cur);cur='';}else{cur+=c;}}res.push(cur);return res;}
  const lines=txt.split('\n').filter(l=>l.trim());if(lines.length<2)return[];
  const hdrs=pl(lines[0]).map(h=>h.trim().toLowerCase());
  const col=(...ns)=>{for(const n of ns){const i=hdrs.indexOf(n);if(i!==-1)return i;}return -1;};
  const res=[];
  for(let i=1;i<lines.length;i++){
    const v=pl(lines[i]);const g=(...ns)=>{const idx=col(...ns);return idx!==-1?(v[idx]||'').trim():'';};
    const title=g('title');if(!title)continue;
    const ty=g('item type','type','itemtype').toLowerCase().replace(/\s/g,'');
    const cm={book:'Autre',journalarticle:'Science',conferencepaper:'Science',thesis:'Science',report:'Technologie',computerprogram:'Technologie',artwork:'Art'};
    res.push({title,author:g('author','authors'),year:g('publication year','year','date').substring(0,4),isbn:g('isbn','isbn/issn'),publisher:g('publisher'),description:g('abstract note','abstract'),category:cm[ty]||'Autre',shelf:'',copies:1});
  }
  return res;
}

// ══ LOGIN ══════════════════════════════════════════════
function Login({onLogin}){
  // mode: 'login' | 'register' | 'member-register' | 'reset' | 'new-password'
  const hashParams = getHashParams();
  const recoveryToken = hashParams.access_token && hashParams.type==='recovery' ? hashParams.access_token : null;
  const [mode,setMode]=useState(recoveryToken?'new-password':'login');
  const [identifier,setIdentifier]=useState('');
  const [email,setEmail]=useState('');
  const [memberCode,setMemberCode]=useState('');
  const [pwd,setPwd]=useState('');
  const [pwd2,setPwd2]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  const [info,setInfo]=useState(recoveryToken?'Entrez votre nouveau mot de passe':'');

  function switchMode(m){ setMode(m); setErr(''); setInfo(''); }

  async function handleLogin(){
    if(!identifier||!pwd){setErr('Identifiant et mot de passe requis');return;}
    setLoading(true); setErr('');
    try{
      const data=await sbSignIn(identifier,pwd);
      if(data.access_token){ storeSession(data); onLogin(data); }
      else setErr('Réponse inattendue du serveur');
    }catch(e){
      const msg=(e.message||'').toLowerCase();
      if(msg.includes('email not confirmed')||msg.includes('not confirmed')){
        setErr("Votre email n'a pas encore été confirmé. Vérifiez votre boîte mail (et vos spams) et cliquez sur le lien envoyé par Supabase.");
      } else if(msg.includes('invalid login')||msg.includes('invalid credentials')||msg.includes('invalid password')||msg.includes('wrong password')){
        setErr("Email ou mot de passe incorrect. Vérifiez vos informations.");
      } else if(msg.includes('user not found')||msg.includes('no user')){
        setErr("Aucun compte trouvé avec cet email. Utilisez l'onglet Membre pour créer votre espace.");
      } else {
        // Afficher le message brut de Supabase pour débogage
        setErr("Erreur: "+(e.message||"inconnue"));
      }
    }
    finally{ setLoading(false); }
  }

  async function handleStaffRegister(){
    if(!email||!pwd){ setErr('Email et mot de passe requis'); return; }
    if(pwd!==pwd2){ setErr('Les mots de passe ne correspondent pas'); return; }
    if(pwd.length<8){ setErr('Minimum 8 caractères'); return; }
    setLoading(true); setErr('');
    try{
      const data=await sbSignUp(email,pwd);
      if(data.access_token){ storeSession(data); onLogin(data); }
      else{ setInfo('Compte créé ! Connectez-vous maintenant.'); switchMode('login'); setEmail(''); setPwd(''); setPwd2(''); }
    }catch(e){ setErr(e.message); }
    finally{ setLoading(false); }
  }

  async function handleMemberRegister(){
    const code=memberCode.trim().toUpperCase().startsWith('MBR-')
      ? memberCode.trim().toUpperCase()
      : `MBR-${memberCode.trim().padStart(4,'0')}`;
    if(!code||!email||!pwd){ setErr('Tous les champs sont requis'); return; }
    if(pwd!==pwd2){ setErr('Les mots de passe ne correspondent pas'); return; }
    if(pwd.length<8){ setErr('Minimum 8 caractères'); return; }
    setLoading(true); setErr('');
    try{
      // 1. Vérifier que la carte existe et que l'email correspond
      const r=await fetch(`${SB_URL}/rest/v1/members?member_code=eq.${encodeURIComponent(code)}&select=email,name`,
        {headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
      const rows=await r.json();
      if(!rows||!rows.length){ setErr(`Carte ${code} introuvable. Vérifiez votre numéro de membre.`); setLoading(false); return; }
      const member=rows[0];
      if(member.email.toLowerCase()!==email.toLowerCase()){
        setErr(`Cet email ne correspond pas à la carte ${code}. Utilisez l'email enregistré à la bibliothèque.`);
        setLoading(false); return;
      }
      // 2. Tentative de création de compte Supabase
      let signupData;
      try{
        signupData=await sbSignUp(email,pwd);
      }catch(signupErr){
        const msg=(signupErr.message||'').toLowerCase();
        if(msg.includes('already registered')||msg.includes('already exists')||msg.includes('user already')){
          setErr("Un compte existe déjà avec cet email. Allez sur l'onglet Connexion et entrez votre email + mot de passe.");
          setLoading(false); return;
        }
        throw signupErr;
      }
      // 3. Envoyer l'email de bienvenue (non-bloquant)
      fetch(`${SB_URL}/functions/v1/send-welcome-email`,{
        method:'POST',
        headers:{'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'},
        body:JSON.stringify({to:email,memberName:member.name,memberCode:code})
      }).catch(()=>{});
      // 4. Analyser la réponse Supabase — tous les cas possibles
      // Cas A : session directe (confirmation email désactivée)
      const token = signupData?.access_token || signupData?.session?.access_token;
      if(token){
        const sessionObj = signupData.access_token ? signupData : signupData.session;
        storeSession(sessionObj); onLogin(sessionObj);
        return;
      }
      // Cas B : user créé, confirmation email en attente
      // Supabase retourne soit { user: {...}, session: null }
      // soit { id, email, ... } directement selon la version
      const userId = signupData?.user?.id || signupData?.id;
      if(userId || signupData?.user || signupData?.email){
        setInfo(`✅ Compte créé pour ${member.name} ! Un email de confirmation a été envoyé à ${email}. Vérifiez vos spams, cliquez sur le lien, puis connectez-vous ici.`);
        switchMode('login'); setMemberCode(''); setEmail(''); setPwd(''); setPwd2('');
        return;
      }
      // Cas C : Supabase retourne objet vide {} (compte déjà existant mais non confirmé)
      if(typeof signupData === 'object'){
        setInfo(`Si vous avez déjà créé un compte, vérifiez vos emails (y compris spams) pour le lien de confirmation, puis connectez-vous avec l'onglet Connexion.`);
        switchMode('login'); setMemberCode(''); setEmail(''); setPwd(''); setPwd2('');
        return;
      }
      setErr('Erreur inattendue. Réessayez.');
    }catch(e){ setErr(e.message||'Erreur lors de la création du compte'); }
    finally{ setLoading(false); }
  }

function SetupWizard({onComplete}){

  const SQL_SCRIPT = `-- ═══════════════════════════════════════════════════
-- BIBLIYOTÈK — Script d'initialisation des tables
-- Exécuter UNE SEULE FOIS dans Supabase → SQL Editor
-- ═══════════════════════════════════════════════════

-- 1. Table membres

  created_at TIMESTAMPTZ DEFAULT now()

-- 10. Activer RLS sur toutes les tables
ALTER TABLE members      ENABLE ROW LEVEL SECURITY;
ALTER TABLE books        ENABLE ROW LEVEL SECURITY;
ALTER TABLE loans        ENABLE ROW LEVEL SECURITY;
ALTER TABLE user_roles   ENABLE ROW LEVEL SECURITY;

CREATE POLICY "full_access" ON members      FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "full_access" ON books        FOR ALL USING (true) WITH CHECK (true);

const set = (k,v) => { setForm(p=>({...p,[k]:v})); setErr(''); };

  async function testConnection(){
    if(!form.url || !form.key){ setErr('URL et clé anon requis.'); return; }
    if(!form.url.startsWith('https://') || !form.url.includes('.supabase.co')){
      setErr('URL invalide. Format: https://xxxxxxxx.supabase.co'); return;
    }
    if(!form.key.startsWith('eyJ')){
      setErr('Clé anon invalide. Elle doit commencer par "eyJ".'); return;
    }
    setTesting(true); setErr('');
    try{
      const r = await fetch(`${form.url.replace(/\/$/,'')}/rest/v1/`, {
        headers:{'apikey':form.key,'Authorization':`Bearer ${form.key}`}
      });
      if(r.ok || r.status===404 || r.status===400){ setStep(2); }
      else { setErr(`Connexion échouée (${r.status}). Vérifiez URL et clé anon.`); }
    }catch(e){ setErr("Impossible de joindre Supabase. Vérifiez l'URL."); }
    setTesting(false);
  }

  async function loginExistingAdmin(){
    if(!form.adminEmail.includes('@')){ setErr('Email admin invalide.'); return; }

  async function createLoan(bookId,memberId){
    const bk=books.find(b=>b.id===bookId);
    if(!bk||bk.available<=0){ toast('Livre non disponible','err'); return; }
    try{
      const due=new Date(); due.setDate(due.getDate()+(cfg.loanDays||14));
      await DB.addLoan({id:gid(),bookId,memberId,loanDate:new Date().toISOString(),dueDate:due.toISOString(),returnDate:null});
      await DB.setAvail(bookId,-1);
      toast('Prêt créé !'); setScanVal(''); setScanSt('Prêt enregistré avec succès');
      setTimeout(()=>setScanSt(''),3000); reload();
    }catch(e){ toast(e.message,'err'); }
  }
  async function returnLoan(loanId){
    const loan=loans.find(l=>l.id===loanId); if(!loan) return;
    const now=new Date(),due=new Date(loan.dueDate);
    const daysLate=Math.max(0,Math.ceil((now-due)/86400000));
    const lateFee=daysLate*(cfg.feePerDay||10);
    try{
      await DB.returnLoan(loanId,daysLate,lateFee);
      await DB.setAvail(loan.bookId,+1);
      if(daysLate>0) toast(`${daysLate}j retard — ${lateFee} HTG`,'warn');
      else {
        toast('Retour enregistré');
        // Notify waiting list
        const wl=reservations.filter(r=>r.bookId===loan.bookId);
        if(wl.length>0){const nx=members.find(m=>m.id===wl[0].memberId);if(nx)setTimeout(()=>toast(`📬 ${nx.name} attend ce livre — pensez à le contacter`,'warn'),1200);}
      }
      reload();
    }catch(e){ toast(e.message,'err'); }
  }

  function handleScan(e){
    if(e.key!=='Enter'||!scanVal.trim()) return;
    const code=scanVal.trim().toUpperCase();
    if(code.startsWith('MBR-')){
      const m=members.find(x=>x.memberCode===code);
      if(m){ setScanItem({type:'member',data:m}); setScanSt(`Membre trouvé : ${m.name}`); }
      else setScanSt('Membre non trouvé');
    } else {
      const b=books.find(x=>x.barcode===code||x.isbn===code||(x.isbn||'').replace(/-/g,'')===code);
      if(b){
        if(scanItem&&scanItem.type==='member'){ createLoan(b.id,scanItem.data.id); setScanItem(null); }
        else{ setScanItem({type:'book',data:b}); setScanSt(`Livre trouvé : ${b.title}`); }
      } else setScanSt('Code non trouvé');
    }
    setScanVal('');
  }

  async function sendLateEmails(){
    const overdueLoans=loans.filter(l=>new Date(l.dueDate)<new Date());
    if(!overdueLoans.length){ toast('Aucun retard à notifier','warn'); return; }
    setEmailSending(true);
    let sent=0,failed=0;
    for(const loan of overdueLoans){
      const mb=members.find(m=>m.id===loan.memberId);
      const bk=books.find(b=>b.id===loan.bookId);
      if(!mb||!mb.email) continue;
      const daysLate=Math.ceil((new Date()-new Date(loan.dueDate))/86400000);
      try{
        const res=await fetch(`${SB_URL}/functions/v1/send-late-email`,{
          method:'POST',
          headers:{'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'},
          body:JSON.stringify({to:mb.email,memberName:mb.name,bookTitle:bk?.title||'?',daysLate,fee:daysLate*(cfg.feePerDay||10),libraryName:cfg.libraryName})
        });
        if(res.ok) sent++; else failed++;
      }catch{ failed++; }
    }
    setEmailSending(false);
    if(sent>0) toast(`${sent} email(s) envoyé(s)`);
    if(failed>0) toast(`${failed} échec(s) — configurez la fonction Edge Supabase`,'warn');
  }

    const file=e.target.files[0]; if(!file) return;
    if(!confirm('Restaurer ce backup ? Les données actuelles seront remplacées.')) return;
    const r=new FileReader();
    r.onload=async ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.members&&!d.books){ toast('Fichier backup invalide','err'); return; }
        toast('Restauration en cours…','info');
        // Restaurer dans localStorage (fallback)
        if(d.members) sd('lib_members',d.members);
        if(d.books) sd('lib_books',d.books);
        if(d.loans) sd('lib_loans',d.loans);
        if(d.settings) localStorage.setItem('lib_cfg',JSON.stringify(d.settings));
        // Restaurer dans Supabase si connecté
        if(USE_SB){
          let ok=0, fail=0;
          // Membres
          if(d.members&&d.members.length){
            for(const m of d.members){
              try{
                await fetch(`${SB_URL}/rest/v1/members`,{
                  method:'POST',
                  headers:{'apikey':SB_KEY,'Authorization':`Bearer ${session?.access_token||SB_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
                  body:JSON.stringify(m)
                });
                ok++;
              }catch(err){ fail++; }
            }
          }
          // Livres
          if(d.books&&d.books.length){
            for(const b of d.books){
              try{
                await fetch(`${SB_URL}/rest/v1/books`,{
                  method:'POST',
                  headers:{'apikey':SB_KEY,'Authorization':`Bearer ${session?.access_token||SB_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
                  body:JSON.stringify(b)
                });
                ok++;
              }catch(err){ fail++; }
            }
          }
          // Prêts
          if(d.loans&&d.loans.length){
            for(const l of d.loans){
              try{
                await fetch(`${SB_URL}/rest/v1/loans`,{
                  method:'POST',
                  headers:{'apikey':SB_KEY,'Authorization':`Bearer ${session?.access_token||SB_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
                  body:JSON.stringify(l)
                });
                ok++;
              }catch(err){ fail++; }
            }
          }
          toast(`Restauration terminée — ${ok} entrées importées${fail>0?' ('+fail+' erreurs)':''}`);
        } else {
          toast('Données importées (mode local)','ok');
        }
        reload();
      }catch(err){ toast('Fichier invalide : '+err.message,'err'); }
    };
    r.readAsText(file,'UTF-8'); e.target.value='';
  }

  function handleZFile(e){
    const file=e.target.files[0]; if(!file) return;
    setZst('Analyse en cours…'); setZp([]);
    const r=new FileReader();
    r.onload=ev=>{
      const txt=ev.target.result,ext=file.name.split('.').pop().toLowerCase();
      let parsed=[];
      if(ext==='bib') parsed=parseBib(txt);
      else if(ext==='ris') parsed=parseRIS(txt);
      else if(ext==='csv') parsed=parseCSV(txt);
      else{ setZst('Format non supporté (.bib, .ris, .csv)'); return; }
      if(!parsed.length) setZst('Aucune référence trouvée');
      else{ setZp(parsed.map((b,i)=>({...b,_s:true,_i:i}))); setZst(`${parsed.length} référence(s) trouvée(s)`); }
    };
    r.readAsText(file,'UTF-8'); e.target.value='';
  }
  async function doZotero(){
    const toImport=zp.filter(b=>b._s);
    if(!toImport.length){ toast('Sélectionnez au moins un livre','err'); return; }
    try{
      const all=await DB.getBooks();

      });

      toast(skip>0?`${nb.length} importé(s), ${skip} doublon(s)`:`${nb.length} livre(s) importé(s)`,skip>0?'warn':'ok');

  // ── ISBN lookup ──────────────────────────────────────
  async function lookupISBN(isbn){
    const clean=isbn.replace(/[\s\-]/g,'');
    if(!clean||clean.length<10){ toast('ISBN invalide (min 10 chiffres)','err'); return null; }
    setIsbnLoading(true);
    try{
      // Try Google Books first
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),7000);
      try{
        const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${clean}&maxResults=1`,{signal:controller.signal});
        clearTimeout(timer);
        if(r.ok){
          const d=await r.json();
          const item=d.items&&d.items[0];
          if(item){
            const info=item.volumeInfo||{};
            const result={
              title:info.title||'',
              author:(info.authors||[]).join(', '),
              year:info.publishedDate?(info.publishedDate.match(/\d{4}/)||[''])[0]:'',
              publisher:info.publisher||'',
              isbn:clean,
              description:info.description?(info.description.substring(0,400)):'',
              cover:(info.imageLinks?.thumbnail||'').replace('http://','https://')
            };
            toast(`✅ ${result.title||'Livre trouvé'} (Google Books)`);
            return result;
          }
        }
      }catch(e){ /* Google Books failed, try OpenLibrary */ }
      // Fallback: OpenLibrary
      try{
        const controller2=new AbortController();
        const timer2=setTimeout(()=>controller2.abort(),6000);
        const r2=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${clean}&format=json&jscmd=data`,{signal:controller2.signal});
        clearTimeout(timer2);
        if(r2.ok){
          const d2=await r2.json();
          const book=d2[`ISBN:${clean}`];
          if(book){
            toast(`✅ ${book.title||'Livre trouvé'} (OpenLibrary)`);
            return {
              title:book.title||'',
              author:(book.authors||[]).map(a=>a.name).join(', '),
              year:book.publish_date?(book.publish_date.match(/\d{4}/)||[''])[0]:'',
              publisher:(book.publishers||[]).map(p=>p.name).join(', '),
              isbn:clean
            };
          }
        }
      }catch(e){ /* OpenLibrary failed */ }
      toast('Aucun livre trouvé pour cet ISBN','warn');
      return null;
    }finally{
      setIsbnLoading(false);
    }
  }

    const exp=new Date(member.membershipExpiry);
    const now=new Date();
    const diff=Math.ceil((exp-now)/86400000);
    if(diff<0) return 'expired';

    return 'active';

    const code=kioskVal.trim().toUpperCase();
    setKioskVal('');
    if(code.startsWith('MBR-')){
      const m=members.find(x=>x.memberCode===code);
      if(m){
        const ml=loans.filter(l=>l.memberId===m.id);
        const overL=ml.filter(l=>new Date(l.dueDate)<new Date());
        setKioskItem({type:'member',data:m,loans:ml,overdue:overL});
        setKioskResult({cls:'info',msg:`Bonjour ${m.name} ! ${ml.length} prêt(s) actif(s)${overL.length>0?' — ⚠️ '+overL.length+' en retard':''}`});
      } else {
        setKioskResult({cls:'err',msg:'Carte non reconnue. Contactez la bibliothèque.'});
        setKioskItem(null);
      }
    } else {
      const b=books.find(x=>x.barcode===code||x.isbn===code);
      if(b){
        if(kioskItem?.type==='member'){
          if(b.available>0){
            createLoan(b.id,kioskItem.data.id);
            setKioskResult({cls:'ok',msg:`✅ Prêt créé pour "${b.title}"`});
            setTimeout(()=>{setKioskItem(null);setKioskResult(null);},3000);
          } else {
            setKioskResult({cls:'err',msg:`"${b.title}" n'est pas disponible.`});
          }
        } else {
          setKioskResult({cls:'info',msg:`📖 ${b.title} — ${b.available}/${b.copies} dispo. Scannez votre carte membre.`});
          setKioskItem({type:'book',data:b});
        }
      } else {
        setKioskResult({cls:'err',msg:'Code non reconnu.'});
      }
    }
    if(kioskRef.current)kioskRef.current.focus();
  }

  async function renewLoan(loanId){
    const loan=loans.find(l=>l.id===loanId); if(!loan) return;
    const newDue=new Date(loan.dueDate); newDue.setDate(newDue.getDate()+(cfg.loanDays||14));
    try{ await DB.renewLoan(loanId,newDue.toISOString()); toast('Prêt renouvelé jusqu\'au '+newDue.toLocaleDateString('fr-FR')); setRenewLoanId(null); reload(); }
    catch(e){ toast(e.message,'err'); }
  }

    try{ await DB.payFine(loanId); toast('Amende marquée payée !'); reload(); }
    catch(e){ toast(e.message,'err'); }
  }
  async function reserveBook(bookId,memberId){
    if(reservations.some(r=>r.bookId===bookId&&r.memberId===memberId)){ toast('Déjà réservé','err'); return; }
