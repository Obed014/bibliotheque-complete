<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliothèque · Obed SANON</title>
<link href="https://fonts.bunny.net/css?family=fraunces:400,600,900|plus-jakarta-sans:300,400,500,600,700&display=swap" rel="stylesheet">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
/* ══ THEMES ══════════════════════════════════════════ */
:root,
[data-theme="light"] {
  --bg:      #f7f8fa;
  --bg2:     #ffffff;
  --bg3:     #f1f3f6;
  --surf:    rgba(0,0,0,.03);
  --surf2:   rgba(0,0,0,.055);
  --border:  rgba(0,0,0,.09);
  --border2: rgba(0,0,0,.14);
  --accent:  #2563eb;
  --accent2: #1d4ed8;
  --accent-t:rgba(37,99,235,.1);
  --accent-t2:rgba(37,99,235,.18);
  --red:     #dc2626;
  --green:   #16a34a;
  --orange:  #ea580c;
  --purple:  #7c3aed;
  --blue:    #2563eb;
  --text:    #111827;
  --text2:   #4b5563;
  --text3:   #9ca3af;
  --shadow:  0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --r:       12px;
  --rs:      8px;
  --sb-bg:   #111827;
  --sb-text: rgba(255,255,255,.75);
  --sb-text2:rgba(255,255,255,.45);
  --sb-border:rgba(255,255,255,.08);
  --sb-active-bg:rgba(255,255,255,.1);
  --sb-active:rgba(255,255,255,.95);
  --sb-accent:#60a5fa;
}

[data-theme="blue"] {
  --bg:      #0f1d35;
  --bg2:     #162440;
  --bg3:     #1e2f50;
  --surf:    rgba(255,255,255,.04);
  --surf2:   rgba(255,255,255,.07);
  --border:  rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.14);
  --accent:  #60a5fa;
  --accent2: #93c5fd;
  --accent-t:rgba(96,165,250,.12);
  --accent-t2:rgba(96,165,250,.2);
  --red:     #f87171;
  --green:   #4ade80;
  --orange:  #fb923c;
  --purple:  #a78bfa;
  --blue:    #60a5fa;
  --text:    #f0f4ff;
  --text2:   #94a3b8;
  --text3:   #475569;
  --shadow:  0 4px 20px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --r:       12px;
  --rs:      8px;
  --sb-bg:   #0a1628;
  --sb-text: rgba(255,255,255,.75);
  --sb-text2:rgba(255,255,255,.4);
  --sb-border:rgba(255,255,255,.06);
  --sb-active-bg:rgba(96,165,250,.12);
  --sb-active:#93c5fd;
  --sb-accent:#60a5fa;
}

[data-theme="green"] {
  --bg:      #f0faf4;
  --bg2:     #ffffff;
  --bg3:     #e8f5ee;
  --surf:    rgba(0,0,0,.03);
  --surf2:   rgba(0,0,0,.05);
  --border:  rgba(0,0,0,.09);
  --border2: rgba(0,0,0,.14);
  --accent:  #16a34a;
  --accent2: #15803d;
  --accent-t:rgba(22,163,74,.1);
  --accent-t2:rgba(22,163,74,.18);
  --red:     #dc2626;
  --green:   #16a34a;
  --orange:  #ea580c;
  --purple:  #7c3aed;
  --blue:    #2563eb;
  --text:    #14532d;
  --text2:   #4b5563;
  --text3:   #9ca3af;
  --shadow:  0 1px 4px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1);
  --r:       12px;
  --rs:      8px;
  --sb-bg:   #14532d;
  --sb-text: rgba(255,255,255,.8);
  --sb-text2:rgba(255,255,255,.45);
  --sb-border:rgba(255,255,255,.08);
  --sb-active-bg:rgba(255,255,255,.12);
  --sb-active:rgba(255,255,255,.95);
  --sb-accent:#4ade80;
}

[data-theme="dark"] {
  --bg:      #0d0f14;
  --bg2:     #13161e;
  --bg3:     #1a1f2c;
  --surf:    rgba(255,255,255,.04);
  --surf2:   rgba(255,255,255,.07);
  --border:  rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.14);
  --accent:  #c9a84c;
  --accent2: #e8c97a;
  --accent-t:rgba(201,168,76,.12);
  --accent-t2:rgba(201,168,76,.2);
  --red:     #f87171;
  --green:   #4ade80;
  --orange:  #fb923c;
  --purple:  #a78bfa;
  --blue:    #60a5fa;
  --text:    #f0f4ff;
  --text2:   #94a3b8;
  --text3:   #475569;
  --shadow:  0 4px 20px rgba(0,0,0,.5);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  --r:       12px;
  --rs:      8px;
  --sb-bg:   #0a0c11;
  --sb-text: rgba(255,255,255,.72);
  --sb-text2:rgba(255,255,255,.38);
  --sb-border:rgba(255,255,255,.06);
  --sb-active-bg:rgba(201,168,76,.1);
  --sb-active:#e8c97a;
  --sb-accent:#c9a84c;
}

/* ══ RESET ═══════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;transition:background .25s,color .25s;
}

/* ══ ANIMATIONS ══════════════════════════════════════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.au{animation:fadeUp .3s ease both}
.au2{animation:fadeUp .3s .06s ease both}
.au3{animation:fadeUp .3s .12s ease both}
.au4{animation:fadeUp .3s .18s ease both}

/* ══ LOGIN ═══════════════════════════════════════════ */
.login-wrap{
  min-height:100vh;display:flex;align-items:stretch;
  background:var(--bg);
}
.login-left{
  flex:1;background:linear-gradient(160deg,#0a1628 0%,#111827 45%,#0d1f3c 75%,#1a3a5c 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 48px;position:relative;overflow:hidden;
}
.login-left::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.login-left-logo{
  width:80px;height:80px;border-radius:22px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;backdrop-filter:blur(10px);
  box-shadow:0 8px 32px rgba(0,0,0,.2);
}
.login-left-title{
  font-family:'Fraunces',serif;font-size:2.4em;font-weight:900;
  color:#fff;text-align:center;line-height:1.1;margin-bottom:12px;
}
.login-left-title span{color:#a5b4fc;}
.login-left-sub{font-size:.9em;color:rgba(255,255,255,.65);text-align:center;line-height:1.6;max-width:280px;margin-bottom:40px}
.login-features{display:flex;flex-direction:column;gap:14px;width:100%;max-width:300px}
.login-feature{display:flex;align-items:center;gap:14px;padding:13px 18px;background:rgba(255,255,255,.04);border-radius:14px;border:1px solid rgba(255,255,255,.08);transition:all .2s}
.login-feature:hover{background:rgba(255,255,255,.07);border-color:rgba(201,132,58,.25)}
.login-feature-icon{width:36px;height:36px;border-radius:10px;background:rgba(201,132,58,.15);border:1px solid rgba(201,132,58,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.login-feature-text{font-size:.83em;color:rgba(255,255,255,.8);font-weight:500;line-height:1.3}
.login-right{
  width:460px;background:var(--bg2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 48px;
}
.login-box{
  width:100%;max-width:380px;
  animation:fadeUp .4s ease;
}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:36px}
.login-brand-icon{width:40px;height:40px;border-radius:10px;background:var(--accent-t2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.login-brand-name{font-family:'Fraunces',serif;font-size:1.4em;font-weight:700;color:var(--text)}
.login-icon{display:none}
.login-title{font-size:1.6em;font-weight:800;color:var(--text);margin-bottom:5px;font-family:'Fraunces',serif}
.login-sub{font-size:.83em;color:var(--text3);margin-bottom:28px}
@media(max-width:768px){
  .login-wrap{flex-direction:column}
  .login-left{display:none}
  .login-right{width:100%;padding:40px 24px}
}
.login-tabs{display:flex;gap:3px;background:var(--surf2);border-radius:var(--rs);padding:4px;margin-bottom:24px}
.login-tab{flex:1;padding:8px 4px;border-radius:calc(var(--rs) - 2px);border:none;background:transparent;color:var(--text2);font-size:.78em;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.login-tab.active{background:var(--bg2);color:var(--accent);box-shadow:var(--shadow)}
.login-err{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);color:var(--red);padding:10px 14px;border-radius:var(--rs);font-size:.83em;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.login-info{background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.25);color:#15803d;padding:10px 14px;border-radius:var(--rs);font-size:.83em;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.login-notice{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:8px 12px;border-radius:var(--rs);font-size:.8em;margin-bottom:12px;display:flex;align-items:flex-start;gap:7px;line-height:1.5}

/* ══ SHELL ════════════════════════════════════════════ */
.shell{display:flex;min-height:100vh}

/* ══ SIDEBAR ══════════════════════════════════════════ */
.sidebar{
  width:260px;background:var(--sb-bg);
  display:flex;flex-direction:column;
  position:fixed;height:100vh;z-index:100;
  transition:background .25s;
  box-shadow:4px 0 24px rgba(0,0,0,.18);
}
.sb-head{
  padding:24px 18px 18px;
  border-bottom:1px solid var(--sb-border);
  background:linear-gradient(180deg,rgba(99,102,241,.08) 0%,transparent 100%);
}
.sb-logo-row{display:flex;align-items:center;gap:12px}
.sb-logo{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,rgba(99,102,241,.3),rgba(139,92,246,.2));
  border:1px solid rgba(99,102,241,.35);
  display:flex;align-items:center;justify-content:center;
  color:var(--sb-accent);flex-shrink:0;object-fit:cover;
  box-shadow:0 4px 12px rgba(99,102,241,.2);
}
.sb-libname{font-family:'Fraunces',serif;font-size:1.05em;font-weight:700;color:#fff;line-height:1.2}
.sb-status{display:inline-flex;align-items:center;gap:5px;font-size:.67em;color:var(--sb-text2);margin-top:2px}
.sb-status-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;flex-shrink:0;animation:pulse 2s infinite}
.sb-status-dot.off{background:#fb923c;animation:none}

.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-nav::-webkit-scrollbar{width:2px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.sb-sec{font-size:.6em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-text2);padding:16px 12px 6px}

.nbtn{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:10px 14px;background:none;border:none;
  color:var(--sb-text);font-size:.85em;font-weight:500;
  cursor:pointer;transition:all .18s;text-align:left;
  font-family:inherit;border-radius:12px;margin-bottom:3px;
  position:relative;
}
.nbtn:hover{background:var(--sb-active-bg);color:var(--sb-active)}
.nbtn.active{
  background:linear-gradient(135deg,rgba(96,165,250,.2),rgba(139,92,246,.12));
  color:#fff;font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(96,165,250,.25);
}
.nbtn.active .ni{
  background:rgba(96,165,250,.25);
  color:var(--sb-accent);
  border-radius:9px;
}
.nbtn .ni{
  width:34px;height:34px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:9px;
  background:rgba(255,255,255,.05);
  transition:all .18s;
}
.nbtn:hover .ni{background:rgba(255,255,255,.1)}
.nbtn .nl{flex:1}
.nbadge{
  background:rgba(255,255,255,.07);border-radius:20px;
  padding:2px 7px;font-size:.69em;font-weight:700;
  color:var(--sb-text2);
}
.nbtn.active .nbadge{background:var(--accent-t);color:var(--sb-accent)}

.sb-foot{padding:12px 12px 18px;border-top:1px solid var(--sb-border);display:flex;flex-direction:column;gap:6px}
.sb-foot-row{display:flex;gap:5px}
.sfbtn{
  flex:1;padding:7px 5px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  color:var(--sb-text);border-radius:var(--rs);
  font-size:.74em;cursor:pointer;font-family:inherit;
  transition:all .16s;text-align:center;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.sfbtn:hover{background:rgba(255,255,255,.1);color:var(--sb-active)}
.sfbtn.zotero{
  background:var(--accent-t);border-color:rgba(255,255,255,.08);
  color:var(--sb-accent);
}
.sfbtn.zotero:hover{background:var(--accent-t2)}
.sfbtn.logout{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.15);color:#f87171}
.sfbtn.logout:hover{background:rgba(220,38,38,.15)}
.sb-user{font-size:.68em;color:var(--sb-text2);text-align:center;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ══ MAIN ═════════════════════════════════════════════ */
.main{flex:1;margin-left:252px;padding:30px 30px 60px;max-width:calc(100vw - 252px)}

/* ══ PAGE HEADER ══════════════════════════════════════ */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.pt{font-family:'Fraunces',serif;font-size:1.8em;font-weight:500;color:var(--text)}

/* ══ STATS ════════════════════════════════════════════ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:26px}
.sc{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:16px;padding:20px 22px;
  position:relative;overflow:hidden;
  transition:all .22s;
  display:flex;flex-direction:column;gap:4px;
}
.sc:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);border-color:var(--border2);transform:translateY(-2px)}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:16px 16px 0 0}
.sc::after{content:'';position:absolute;top:12px;right:16px;width:44px;height:44px;border-radius:12px;opacity:.12}
.sc.c-blue::before{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.sc.c-blue::after{background:#2563eb}
.sc.c-green::before{background:linear-gradient(90deg,#16a34a,#4ade80)}
.sc.c-green::after{background:#16a34a}
.sc.c-purple::before{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.sc.c-purple::after{background:#7c3aed}
.sc.c-orange::before{background:linear-gradient(90deg,#ea580c,#fb923c)}
.sc.c-orange::after{background:#ea580c}
.sc.c-red::before{background:linear-gradient(90deg,#dc2626,#f87171)}
.sc.c-red::after{background:#dc2626}
.sc.c-accent::before{background:linear-gradient(90deg,#2563eb,#818cf8)}
.sc.c-accent::after{background:#2563eb}
.sc-icon{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;opacity:.9}
.sn{font-size:2.3em;font-weight:700;color:var(--text);line-height:1;margin-bottom:2px;font-family:'Fraunces',serif}
.sl{font-size:.76em;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.sd{font-size:.72em;color:var(--text3);font-weight:400;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}

/* ══ BUTTONS ══════════════════════════════════════════ */
.btn{
  padding:9px 18px;border:none;border-radius:var(--rs);
  font-size:.86em;font-weight:600;cursor:pointer;
  transition:all .16s;display:inline-flex;align-items:center;gap:6px;
  font-family:inherit;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn-primary:hover{background:var(--accent2);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn-success{background:var(--accent-t);color:var(--green);border:1px solid rgba(22,163,74,.2)}
.btn-success:hover{background:rgba(22,163,74,.18)}
.btn-danger{background:rgba(220,38,38,.08);color:var(--red);border:1px solid rgba(220,38,38,.18)}
.btn-danger:hover{background:rgba(220,38,38,.15)}
.btn-secondary{background:var(--surf2);color:var(--text2);border:1px solid var(--border2)}
.btn-secondary:hover{background:var(--bg3);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surf);color:var(--text2)}
.btn-email{background:rgba(37,99,235,.08);color:var(--blue);border:1px solid rgba(37,99,235,.18)}
.btn-email:hover{background:rgba(37,99,235,.15)}
.btn-sm{padding:6px 12px;font-size:.79em}

/* ══ SEARCH / FILTER ══════════════════════════════════ */
.sw{position:relative;margin-bottom:14px}
.sw-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.sbar{
  width:100%;padding:9px 13px 9px 36px;
  border:1px solid var(--border);border-radius:var(--rs);
  font-size:.88em;background:var(--bg2);color:var(--text);
  font-family:inherit;transition:border-color .18s,box-shadow .18s;
}
.sbar:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-t)}
.fbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.fsel{
  padding:8px 12px;border:1px solid var(--border);border-radius:var(--rs);
  font-size:.84em;background:var(--bg2);color:var(--text2);
  cursor:pointer;font-family:inherit;transition:border-color .18s;
}
.fsel:focus{outline:none;border-color:var(--accent)}

/* ══ CARDS ════════════════════════════════════════════ */
.grid{display:grid;gap:12px}
.card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:18px;
  transition:all .18s;
}
.card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.card.late{border-color:rgba(220,38,38,.25);background:rgba(220,38,38,.02)}
.ct{font-size:1.02em;font-weight:700;color:var(--text);margin-bottom:3px}
.cs{color:var(--text3);font-size:.83em;margin-bottom:2px;line-height:1.5}
.cm{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.ca{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}

/* ══ BADGES ═══════════════════════════════════════════ */
.b{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:.72em;font-weight:600}
.bg{background:rgba(22,163,74,.1);color:var(--green)}
.br{background:rgba(220,38,38,.1);color:var(--red)}
.bp{background:rgba(124,58,237,.1);color:var(--purple)}
.bb{background:rgba(37,99,235,.1);color:var(--blue)}
.bo{background:rgba(234,88,12,.1);color:var(--orange)}
.bk{background:var(--surf2);color:var(--text3)}
.ba{background:var(--accent-t);color:var(--accent)}

/* ══ MODAL ════════════════════════════════════════════ */
.ov{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;animation:fadeIn .15s;
}
.mc{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:18px;padding:30px;
  max-width:580px;width:93%;max-height:90vh;overflow-y:auto;
  animation:fadeUp .2s ease;box-shadow:var(--shadow-lg);
}
.mc.wide{max-width:720px}
.mc::-webkit-scrollbar{width:3px}
.mc::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.mt{font-family:'Fraunces',serif;font-size:1.4em;font-weight:500;color:var(--text)}
.xb{
  background:var(--surf2);border:none;cursor:pointer;
  color:var(--text3);width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:all .16s;
}
.xb:hover{background:var(--bg3);color:var(--text)}

/* ══ FORMS ════════════════════════════════════════════ */
.fg{margin-bottom:14px}
.fl{display:block;font-weight:600;color:var(--text3);margin-bottom:4px;font-size:.78em;letter-spacing:.03em;text-transform:uppercase}
.fi,.ft{
  width:100%;padding:9px 12px;
  border:1px solid var(--border);border-radius:var(--rs);
  font-size:.88em;background:var(--bg3);color:var(--text);
  font-family:inherit;transition:border-color .18s,box-shadow .18s;
}
.fi:focus,.ft:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-t)}
.ft{resize:vertical;min-height:78px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fac{display:flex;gap:9px;margin-top:22px}

/* ══ PHOTO UPLOAD ═════════════════════════════════════ */
.pu{
  border:2px dashed var(--border2);border-radius:var(--r);
  padding:20px;text-align:center;cursor:pointer;
  transition:all .2s;background:var(--surf);
}
.pu:hover{border-color:var(--accent);background:var(--accent-t)}
.pp{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin:10px auto;display:block}

/* ══ SCANNER ══════════════════════════════════════════ */
.scan-box{
  background:var(--bg2);border:1px solid var(--border2);
  padding:22px;border-radius:var(--r);margin-bottom:22px;
  box-shadow:var(--shadow);
}
.scan-in{
  width:100%;padding:12px 16px;
  border:1.5px solid var(--border2);border-radius:var(--rs);
  font-size:1em;font-weight:500;font-family:inherit;
  background:var(--bg3);color:var(--text);
  transition:border-color .2s,box-shadow .2s;
}
.scan-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-t)}
.scan-st{margin-top:11px;padding:9px 14px;background:var(--surf2);border-radius:var(--rs);font-size:.87em;border:1px solid var(--border)}

/* ══ CAT GRID ═════════════════════════════════════════ */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px;margin-bottom:26px}
.cc{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;
  transition:all .18s;
}
.cc:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.cn{font-size:2em;font-weight:700;color:var(--accent);font-family:'Fraunces',serif}
.cl{font-size:.73em;color:var(--text3);margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}

/* ══ ALERTS ═══════════════════════════════════════════ */
.al{padding:11px 15px;border-radius:var(--rs);margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:.85em;flex-wrap:wrap}
.al-w{background:rgba(234,88,12,.08);color:var(--orange);border:1px solid rgba(234,88,12,.18)}
.al-s{background:rgba(22,163,74,.08);color:var(--green);border:1px solid rgba(22,163,74,.18)}
.al-i{background:var(--accent-t);color:var(--accent);border:1px solid var(--accent-t2)}
.al-e{background:rgba(220,38,38,.08);color:var(--red);border:1px solid rgba(220,38,38,.18)}

/* ══ EMPTY ════════════════════════════════════════════ */
.empty{text-align:center;padding:56px 20px;color:var(--text3)}
.empty-i{margin-bottom:12px;opacity:.3;display:flex;justify-content:center}

/* ══ SETTINGS SECTION ════════════════════════════════ */
.ss{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px}
.ss h3{font-size:.78em;font-weight:700;color:var(--text2);margin-bottom:13px;text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ══ QR / AVATAR ══════════════════════════════════════ */
.qr{width:82px;height:82px;border-radius:var(--rs);flex-shrink:0;background:white;padding:3px;border:1px solid var(--border)}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--accent-t2);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent-t),var(--surf2));color:var(--accent);box-shadow:0 2px 8px rgba(37,99,235,.15)}

/* ══ TOAST ════════════════════════════════════════════ */
.tc{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:7px;z-index:9999;pointer-events:none}
.toast{
  background:var(--bg2);color:var(--text);border:1px solid var(--border2);
  padding:11px 16px;border-radius:var(--rs);
  box-shadow:var(--shadow-lg);font-size:.85em;font-weight:500;
  animation:toastIn .2s ease;min-width:200px;
  display:flex;align-items:center;gap:8px;
}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
.toast.warn{border-left:3px solid var(--orange)}

/* ══ ZOTERO ═══════════════════════════════════════════ */
.zdrop{
  border:2px dashed var(--border2);border-radius:var(--r);
  padding:26px;text-align:center;cursor:pointer;
  background:var(--surf);transition:all .2s;margin-bottom:14px;
}
.zdrop:hover{border-color:var(--accent);background:var(--accent-t)}
.zlist{max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:14px}
.zlist::-webkit-scrollbar{width:3px}
.zlist::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.zrow{display:flex;align-items:start;gap:11px;padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .13s}
.zrow:last-child{border-bottom:none}
.zrow:hover,.zrow.sel{background:var(--accent-t)}

/* ══ DIVIDER / SPINNER ════════════════════════════════ */
.divider{height:1px;background:var(--border);margin:18px 0}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;flex-shrink:0}

/* ══ THEME SWATCHES ═══════════════════════════════════ */
.theme-swatches{display:flex;gap:9px;flex-wrap:wrap}
.theme-swatch{
  cursor:pointer;border-radius:var(--rs);padding:9px 13px;
  display:flex;align-items:center;gap:7px;
  transition:all .18s;border:2px solid transparent;
  font-size:.82em;font-weight:600;
}

.selected-card{outline:2px solid var(--accent)!important;background:var(--accent-t)!important}
.selected-card:hover{background:var(--accent-t)!important}
kbd{font-family:monospace;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:.85em}
.b.bo{background:rgba(234,88,12,.13);color:#ea580c}
.pending-badge{display:inline-flex;align-items:center;justify-content:center;background:#f97316;color:#fff;border-radius:99px;font-size:.65em;font-weight:800;padding:1px 6px;margin-left:4px}

/* ══ RESPONSIVE ═══════════════════════════════════════ */
@media(max-width:768px){
  .sidebar{width:100%;height:auto;position:relative}
  .main{margin-left:0;padding:16px;max-width:100%}
  .fgrid{grid-template-columns:1fr}
}

/* ══ SIGNATURE / ABOUT ══════════════════════════════════ */
.owner-sig{
  padding:10px 16px;border-top:1px solid var(--sb-border);
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.03);
}
.owner-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--sb-accent),var(--accent2,#1d4ed8));
  display:flex;align-items:center;justify-content:center;
  font-size:.75em;font-weight:800;color:#fff;flex-shrink:0;
  letter-spacing:.02em;
}
.owner-info{flex:1;min-width:0}
.owner-name{font-size:.72em;font-weight:700;color:var(--sb-active);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owner-role{font-size:.62em;color:var(--sb-text2);letter-spacing:.03em}

/* ══ ABOUT MODAL ════════════════════════════════════════ */
.db-error-banner{position:fixed;top:0;left:0;right:0;z-index:8000;background:#fef3c7;border-bottom:2px solid #f59e0b;padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:.85em;color:#92400e;}
.db-error-banner strong{font-weight:700;}
.db-error-banner a{color:#92400e;font-weight:700;text-decoration:underline;cursor:pointer;}
.db-error-banner button{margin-left:auto;background:#f59e0b;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:.8em;font-weight:700;}
.legal-modal{max-width:680px;max-height:80vh;overflow-y:auto;padding:0}
.legal-header{position:sticky;top:0;background:var(--bg2);border-bottom:2px solid var(--accent);padding:16px 20px;z-index:1;display:flex;justify-content:space-between;align-items:center}
.legal-header h2{margin:0;font-size:1.1em;color:var(--accent);font-weight:700}
.legal-body{padding:20px}
.legal-body h3{font-size:.95em;font-weight:700;color:var(--accent);margin:20px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.legal-body h4{font-size:.85em;font-weight:700;color:var(--text1);margin:14px 0 4px}
.legal-body p{font-size:.82em;color:var(--text2);line-height:1.75;margin:4px 0 8px}
.legal-body ul{margin:4px 0 10px;padding-left:18px}
.legal-body ul li{font-size:.82em;color:var(--text2);line-height:1.75;margin:2px 0}
.legal-footer-links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:8px 0 4px;border-top:1px solid var(--border);margin-top:8px}
.legal-footer-links button{background:none;border:none;color:var(--accent);font-size:.75em;cursor:pointer;text-decoration:underline;padding:2px 4px}
.about-hero{
  background:linear-gradient(135deg,#1e3a5f 0%,#0f1d35 100%);
  border-radius:var(--r);padding:28px;text-align:center;margin-bottom:18px;
  position:relative;overflow:hidden;
}
.about-hero::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(96,165,250,.1);
}
.about-hero::after{
  content:'';position:absolute;bottom:-30px;left:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(201,168,76,.08);
}
.about-avatar{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6em;font-weight:800;color:#fff;
  margin:0 auto 14px;border:3px solid rgba(255,255,255,.2);
  position:relative;z-index:1;
}
.about-name{font-family:'Fraunces',serif;font-size:1.4em;color:#fff;font-weight:500;position:relative;z-index:1}
.about-title{font-size:.78em;color:rgba(255,255,255,.55);margin-top:4px;position:relative;z-index:1;letter-spacing:.05em;text-transform:uppercase}

/* ══ DONATIONS ════════════════════════════════════════ */
.donation-card{
  background:linear-gradient(135deg,rgba(22,163,74,.08),rgba(22,163,74,.03));
  border:1px solid rgba(22,163,74,.2);border-radius:var(--r);padding:18px;
  margin-bottom:14px;
}
.donation-card:hover{border-color:rgba(22,163,74,.35);box-shadow:var(--shadow)}

/* ══ PUBLIC CATALOGUE ════════════════════════════════ */
.pub-hero{
  background:linear-gradient(135deg,var(--sb-bg) 0%,#1e3a5f 100%);
  padding:40px 30px;text-align:center;margin-bottom:24px;
  border-radius:0 0 var(--r) var(--r);
}
.pub-search-wrap{
  max-width:520px;margin:0 auto;position:relative;
}
.pub-sbar{
  width:100%;padding:14px 18px 14px 46px;
  border:2px solid rgba(255,255,255,.2);border-radius:30px;
  font-size:1em;background:rgba(255,255,255,.1);color:#fff;
  font-family:inherit;backdrop-filter:blur(8px);
  transition:border-color .2s,box-shadow .2s;
}
.pub-sbar::placeholder{color:rgba(255,255,255,.5)}
.pub-sbar:focus{outline:none;border-color:rgba(255,255,255,.5);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.pub-search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.6)}

/* ══ SUGGESTIONS ═════════════════════════════════════ */
.sug-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;transition:all .18s;
}
.sug-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.vote-btn{
  background:var(--surf2);border:1px solid var(--border2);
  border-radius:var(--rs);padding:6px 12px;cursor:pointer;
  font-size:.78em;font-weight:700;color:var(--text2);
  transition:all .15s;display:flex;align-items:center;gap:5px;
  font-family:inherit;
}
.vote-btn:hover,.vote-btn.voted{background:var(--accent-t);color:var(--accent);border-color:var(--accent-t2)}

/* ══ STATISTICS ══════════════════════════════════════ */
.chart-wrap{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;margin-bottom:14px;
}
.chart-title{font-size:.78em;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.bar-chart-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-chart-label{width:90px;font-size:.78em;color:var(--text2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-chart-bar{height:20px;border-radius:4px;background:var(--accent);transition:width .4s ease;min-width:4px}
.bar-chart-val{font-size:.75em;color:var(--text3);font-weight:600;white-space:nowrap}

/* ══ KIOSK ═══════════════════════════════════════════ */
.kiosk-wrap{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;background:var(--bg);
}
.kiosk-box{
  width:100%;max-width:480px;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:24px;padding:40px 36px;box-shadow:var(--shadow-lg);
  text-align:center;
}
.kiosk-icon{
  width:80px;height:80px;border-radius:20px;
  background:var(--accent-t2);border:2px solid var(--accent-t2);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;color:var(--accent);
}
.kiosk-title{font-family:'Fraunces',serif;font-size:2em;color:var(--text);margin-bottom:8px}
.kiosk-sub{color:var(--text3);font-size:.9em;margin-bottom:28px}
.kiosk-scan{
  width:100%;padding:16px 20px;
  border:2px solid var(--border2);border-radius:var(--rs);
  font-size:1.1em;font-weight:600;font-family:inherit;
  background:var(--bg3);color:var(--text);
  transition:border-color .2s,box-shadow .2s;text-align:center;
}
.kiosk-scan:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-t)}
.kiosk-result{
  margin-top:20px;padding:16px;border-radius:var(--rs);
  font-weight:600;font-size:.95em;
}
.kiosk-result.ok{background:rgba(22,163,74,.1);color:var(--green);border:1px solid rgba(22,163,74,.25)}
.kiosk-result.err{background:rgba(220,38,38,.1);color:var(--red);border:1px solid rgba(220,38,38,.25)}
.kiosk-result.info{background:var(--accent-t);color:var(--accent);border:1px solid var(--accent-t2)}

/* ══ WAITLIST NOTIFICATION ════════════════════════════ */
.waitlist-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(234,88,12,.1);color:var(--orange);
  border:1px solid rgba(234,88,12,.2);border-radius:20px;
  padding:3px 10px;font-size:.72em;font-weight:700;
}

/* ══ BOOK COVERS ════════════════════════════════════════ */
.book-cover{
  width:48px;height:68px;border-radius:6px;object-fit:cover;
  flex-shrink:0;background:var(--bg3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4em;overflow:hidden;
}
.book-cover img{width:100%;height:100%;object-fit:cover;border-radius:5px}

/* ══ ACTIVITY CHART ══════════════════════════════════════ */
.activity-dots{
  display:flex;gap:6px;align-items:flex-end;height:80px;
  position:relative;
}
.activity-dot{
  flex:1;border-radius:5px 5px 0 0;
  background:linear-gradient(180deg,var(--accent),rgba(37,99,235,.45));
  min-width:8px;transition:all .3s;
  box-shadow:0 2px 8px rgba(37,99,235,.2);
}
.activity-dot:hover{opacity:1}

/* ══ MEMBERSHIP BADGE ════════════════════════════════════ */
.mbship-active{background:rgba(22,163,74,.1);color:var(--green);border:1px solid rgba(22,163,74,.2);border-radius:20px;padding:3px 10px;font-size:.72em;font-weight:700}
.mbship-expired{background:rgba(220,38,38,.1);color:var(--red);border:1px solid rgba(220,38,38,.2);border-radius:20px;padding:3px 10px;font-size:.72em;font-weight:700}
.mbship-expiring{background:rgba(234,88,12,.1);color:var(--orange);border:1px solid rgba(234,88,12,.2);border-radius:20px;padding:3px 10px;font-size:.72em;font-weight:700}

/* ══ RECEIPT / PRINT ═════════════════════════════════════ */
.receipt{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r);padding:20px;
  font-family:monospace;font-size:.8em;
  line-height:1.8;
}
.receipt-row{display:flex;justify-content:space-between;gap:10px}
.receipt-sep{border:none;border-top:1px dashed var(--border);margin:8px 0}

/* ══ ONBOARDING ══════════════════════════════════════════ */
.onboard-step{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 24px;
  display:flex;gap:16px;align-items:flex-start;
  transition:all .2s;
}
.onboard-step.done{opacity:.5}
.onboard-step.active{border-color:var(--accent);background:var(--accent-t)}
.onboard-num{
  width:32px;height:32px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.85em;flex-shrink:0;
}
.onboard-step.done .onboard-num{background:var(--green)}

/* ══ MESSAGING ═══════════════════════════════════════════ */
.msg-bubble{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
  transition:all .18s;
}
.msg-bubble:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.msg-bubble.unread{border-left:3px solid var(--accent);background:var(--accent-t)}

/* ══ CALENDAR ════════════════════════════════════════════ */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:2px;margin-top:12px;
}
.cal-cell{
  aspect-ratio:1;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:.8em;cursor:pointer;transition:all .15s;
  position:relative;
}
.cal-cell:hover{background:var(--bg3)}
.cal-cell.today{background:var(--accent);color:#fff;font-weight:700}
.cal-cell.has-event::after{
  content:'';position:absolute;bottom:3px;
  width:4px;height:4px;border-radius:50%;background:var(--gold,#c9843a);
}
.cal-cell.other-month{opacity:.3}

/* ══ PWA INSTALL BANNER ══════════════════════════════════ */
.pwa-banner{
  position:fixed;bottom:20px;right:20px;z-index:1000;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r);padding:14px 18px;
  box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:12px;
  max-width:320px;animation:fadeUp .4s ease;
}

/* ══ DEMO MODE BANNER ════════════════════════════════════ */
.demo-banner{
  background:linear-gradient(90deg,var(--orange),#f59e0b);
  color:#fff;text-align:center;padding:8px 16px;
  font-size:.8em;font-weight:700;letter-spacing:.03em;
  position:sticky;top:0;z-index:200;
}

/* ══ LANGUAGE SELECTOR ═══════════════════════════════════ */
.lang-btn{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--rs);padding:5px 10px;
  font-size:.75em;font-weight:700;cursor:pointer;
  color:var(--text2);transition:all .15s;font-family:inherit;
}
.lang-btn.active{background:var(--accent-t);color:var(--accent);border-color:var(--accent-t2)}

/* ══ TEAM TABS ═════════════════════════════════════════════════════ */
.team-tabs{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px;}
.team-tab-btn{flex:1;padding:9px 12px;border:none;background:transparent;font-family:inherit;font-size:.78em;font-weight:700;color:var(--text3);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;}
.team-tab-btn.active{background:var(--bg2);color:var(--accent);border-bottom:2px solid var(--accent);}
.team-tab-btn:hover:not(.active){background:var(--bg2);color:var(--text2);}
.user-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;transition:all .18s;}
.user-card:hover{border-color:var(--border2);box-shadow:var(--shadow);}
.log-entry{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--border);font-size:.8em;}
.log-entry:last-child{border-bottom:none;}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.expiry-ok{color:var(--green);font-size:.72em;font-weight:700}
.expiry-soon{color:var(--orange);font-size:.72em;font-weight:700}
.expiry-past{color:var(--red);font-size:.72em;font-weight:700}
/* ══ WATERMARK ═══════════════════════════════════════════ */
.bibliyotek-watermark{
  text-align:center;padding:8px;font-size:.7em;
  color:var(--text3);border-top:1px solid var(--border);
}
.bibliyotek-watermark a{color:var(--accent);text-decoration:none;font-weight:600}

-- BIBLIYOTÈK — Script d'initialisation des tables
-- Exécuter UNE SEULE FOIS dans Supabase → SQL Editor
-- ═══════════════════════════════════════════════════

-- 1. Table membres
CREATE TABLE IF NOT EXISTS members (
  id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  member_code TEXT UNIQUE,
  first_name TEXT, last_name TEXT,
  email TEXT, phone TEXT,
  address TEXT, date_of_birth DATE,
  id_number TEXT, membership_type TEXT,
  membership_expiry DATE,
  status TEXT DEFAULT 'active',
  photo_url TEXT,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 2. Table livres
CREATE TABLE IF NOT EXISTS books (
  id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  title TEXT NOT NULL,
  author TEXT, isbn TEXT,
  category TEXT, publisher TEXT,
  year INTEGER, pages INTEGER,
  description TEXT, cover_url TEXT,
  copies INTEGER DEFAULT 1,
  available INTEGER DEFAULT 1,
  location TEXT,
  added_date DATE DEFAULT CURRENT_DATE,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 3. Table emprunts
CREATE TABLE IF NOT EXISTS loans (
  id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  book_id BIGINT REFERENCES books(id),
  member_id BIGINT REFERENCES members(id),
  loan_date DATE DEFAULT CURRENT_DATE,
  due_date DATE,
  return_date DATE,
  fine_amount DECIMAL(10,2) DEFAULT 0,
  fine_paid BOOLEAN DEFAULT FALSE,
  fine_paid_date TIMESTAMPTZ,
  notes TEXT,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 4. Table rôles utilisateurs
CREATE TABLE IF NOT EXISTS user_roles (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  user_id UUID UNIQUE NOT NULL,
  email TEXT,
  role TEXT DEFAULT 'readonly',
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 5. Table réservations
CREATE TABLE IF NOT EXISTS reservations (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  book_id BIGINT REFERENCES books(id),
  member_id BIGINT REFERENCES members(id),
  reserved_date DATE DEFAULT CURRENT_DATE,
  status TEXT DEFAULT 'pending',
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 6. Table événements
CREATE TABLE IF NOT EXISTS events (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  title TEXT NOT NULL,
  description TEXT, category TEXT,
  date TIMESTAMPTZ, time TEXT, location TEXT,
  capacity INTEGER, registered INTEGER DEFAULT 0,
  registrations JSONB DEFAULT '[]',
  flyer TEXT, flyer_url TEXT,
  is_public BOOLEAN DEFAULT TRUE,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 7. Table messages
CREATE TABLE IF NOT EXISTS messages (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  "from" UUID, "to" UUID,
  from_email TEXT, to_email TEXT,
  subject TEXT, body TEXT,
  read BOOLEAN DEFAULT FALSE,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 8. Table donations
CREATE TABLE IF NOT EXISTS donations (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  donor_name TEXT, donor_email TEXT,
  book_title TEXT, book_author TEXT,
  amount DECIMAL(10,2), currency TEXT DEFAULT 'HTG',
  method TEXT, reference TEXT,
  notes TEXT, confirmed BOOLEAN DEFAULT FALSE,
  added_to_library BOOLEAN DEFAULT FALSE,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 9. Table suggestions
CREATE TABLE IF NOT EXISTS suggestions (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  title TEXT NOT NULL,
  author TEXT, category TEXT,
  suggested_by TEXT, votes INTEGER DEFAULT 0,
  status TEXT DEFAULT 'pending',
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 10. Activer RLS sur toutes les tables
ALTER TABLE members      ENABLE ROW LEVEL SECURITY;
ALTER TABLE books        ENABLE ROW LEVEL SECURITY;
ALTER TABLE loans        ENABLE ROW LEVEL SECURITY;
ALTER TABLE user_roles   ENABLE ROW LEVEL SECURITY;
ALTER TABLE reservations ENABLE ROW LEVEL SECURITY;
ALTER TABLE events       ENABLE ROW LEVEL SECURITY;
ALTER TABLE messages     ENABLE ROW LEVEL SECURITY;
ALTER TABLE donations    ENABLE ROW LEVEL SECURITY;
ALTER TABLE suggestions  ENABLE ROW LEVEL SECURITY;

-- 11. Policies RLS — accès ouvert (sécurité gérée côté application)
CREATE POLICY "full_access" ON members      FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "full_access" ON books        FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "full_access" ON loans        FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "full_access" ON reservations FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "full_access" ON events       FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "full_access" ON messages     FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "full_access" ON donations    FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "full_access" ON suggestions  FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "read_roles"  ON user_roles   FOR SELECT USING (true);
CREATE POLICY "write_roles" ON user_roles   FOR ALL    USING (true) WITH CHECK (true);

-- → Décochez "Enable email confirmations"
